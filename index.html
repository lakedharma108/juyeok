function count(){ $('#count').textContent=records.length; }count();
function hex(bits,moving=[]){
 const label=bits.map((b,i)=>posNames[i]+(b?' 양효':' 음효')+(moving.includes(i)?' 동효':'')).join(', ');
 const rows=[5,4,3,2,1,0].map((i,row)=>{const y=8+row*26,color=moving.includes(i)?'#a34e3b':'#282f2c';return (bits[i]?`<rect x="8" y="${y}" width="128" height="13" fill="${color}"/>`:`<rect x="8" y="${y}" width="53" height="13" fill="${color}"/><rect x="83" y="${y}" width="53" height="13" fill="${color}"/>`)+(moving.includes(i)?`<text x="153" y="${y+13}" fill="#a34e3b" font-size="19" text-anchor="middle">${bits[i]?'○':'×'}</text>`:'');}).join('');
 return `<div class="hex"><svg class="hexagram-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 160" role="img" aria-label="${esc(label)}">${rows}</svg></div>`;
}
function lineTitle(h,p){const bit=Yi.patterns[h.id-1][p];return p===0?'초'+(bit==='1'?'구':'육'):p===5?'상'+(bit==='1'?'구':'육'):(bit==='1'?'구':'육')+['','이','삼','사','오'][p]}
function setPage(p){if(busy)return;page=p;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));if(p==='cast'){if(current&&values.length===6)renderResult();else renderCast();}else if(p==='library')renderLibrary();else if(p==='history')renderHistory();else renderGuide();window.scrollTo({top:0,behavior:'instant'})}
function progress(){
 const rows=[5,4,3,2,1,0].map((i,row)=>{const v=values[i],y=15+row*32,moving=v===6||v===9,color=moving?'#a34e3b':'#282f2c';let line;
 if(!v)line=`<rect x="65" y="${y}" width="148" height="13" rx="1" fill="#dedfd4"/>`;
 else if(v%2)line=`<rect x="65" y="${y}" width="148" height="13" fill="${color}"/>`;
 else line=`<rect x="65" y="${y}" width="61" height="13" fill="${color}"/><rect x="152" y="${y}" width="61" height="13" fill="${color}"/>`;
 return `<text x="44" y="${y+11}" font-size="11" text-anchor="end" fill="#788078">${posNames[i]}</text>${line}<text x="228" y="${y+12}" font-size="17" fill="#a34e3b">${moving?(v===9?'○':'×'):''}</text><text x="257" y="${y+11}" font-size="11" fill="${moving?'#a34e3b':'#788078'}">${v?valueNames[v]+' '+v:'대기'}</text>`;
 }).join('');
 return `<div class="progress-heading"><span class="small-label">동전으로 얻은 괘 · 아래에서 위로</span><strong>${values.length} / 6 효</strong></div><svg class="casting-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 205" role="img" aria-label="${values.length}개 효 완성. ${values.map((v,i)=>posNames[i]+' '+(v%2?'양효':'음효')+(v===6||v===9?' 동효':'')).join(', ')}">${rows}</svg><p class="diagram-legend">양효는 한 줄, 음효는 가운데가 끊어진 두 줄입니다.<br><b>붉은 선과 ○·×는 변하는 효(동효)</b>입니다.</p>`;
}
function renderCast(){main.innerHTML=`<section class="hero reveal"><div><div class="eyebrow">주역, 오늘의 물음</div><h1>고요히 묻고,<br><em>변화를 읽다.</em></h1><p>세 닢의 동전, 여섯 번의 물음.<br>오래된 지혜를 빌려 지금의 방향을 살펴보세요.</p></div><div class="hero-art" aria-hidden="true"><div class="orbit"></div><div class="orbit two"></div>${hex([0,0,0,0,1,1])}<span class="art-label">觀象 · 察變</span><span class="art-small">바라보고, 헤아리다</span></div></section><div class="ritual-layout"><section class="ritual"><div class="step-title"><span class="num">01</span><label for="question">마음속 물음을 적어주세요</label><span class="optional">선택 사항</span></div><textarea id="question" maxlength="500" placeholder="예: 새로 시작하려는 일에서, 무엇을 먼저 살펴야 할까요?" ${values.length?'disabled':''}>${esc(question)}</textarea><p class="hint">한 가지 상황을 떠올리고, 지금 필요한 방향을 물어보세요.</p><div class="divider"></div><div class="step-title"><span class="num">02</span><span>${mode==='coins'?'동전 세 닢을 던져주세요':'여섯 효를 직접 입력하세요'}</span><div class="mode-switch"><button data-mode="coins" class="${mode==='coins'?'on':''}" ${values.length?'disabled':''}>동전 던지기</button><button data-mode="manual" class="${mode==='manual'?'on':''}" ${values.length?'disabled':''}>직접 입력</button></div></div>${mode==='coins'?`<div class="coins" aria-hidden="true">${[0,1,2].map(i=>`<div class="coin"><small>${faces[i]===3?'B · 3':'A · 2'}</small><span>${faces.length?(faces[i]===3?'陽':'陰'):'易'}</span></div>`).join('')}</div><div class="coin-caption" aria-live="polite">${faces.length?'이번 합계 '+values[values.length-1]+' · '+valueNames[values[values.length-1]]+(values[values.length-1]===6?' · 음에서 양으로 변합니다':values[values.length-1]===9?' · 양에서 음으로 변합니다':' · 변하지 않는 효'):'A면은 2, B면은 3 · 세 동전의 합으로 한 효를 얻습니다'}</div><section class="cast-diagram" id="progress" aria-live="polite">${progress()}</section><button class="primary cast-button" id="toss"><span>${values.length===6?'완성된 괘 해석 보기':values.length===0?'첫 번째 동전 던지기':(values.length+1)+'번째 동전 던지기'}</span><span>→</span></button><div class="subactions"><span class="hint">초효부터 상효까지, 아래에서 위로 쌓습니다.</span><button class="text-button" id="${values.length?'reset':'auto'}">${values.length?'다시 시작':'여섯 번 한 번에'}</button></div>`:`<div class="manual-grid">${posNames.map((n,i)=>`<label>${n}<select aria-label="${n} 값" id="manual-${i}"><option value="">선택</option><option value="6">6 노음</option><option value="7">7 소양</option><option value="8">8 소음</option><option value="9">9 노양</option></select></label>`).join('')}</div><p class="coin-caption">실제 동전으로 얻은 값을 초효부터 순서대로 입력하세요.</p><button class="primary cast-button" id="manual-submit">입력한 괘 해석 보기 <span>→</span></button>`}</section></div><div class="notes-row"><div class="note"><span class="glyph">☷</span><div><strong>본괘와 지괘를 함께</strong><p>지금의 형상과 변화한 형상을 나란히 읽습니다.</p></div></div><div class="note"><span class="glyph">爻</span><div><strong>동효에서 찾는 변화</strong><p>움직이는 효에 따라 읽을 문장이 달라집니다.</p></div></div><div class="note"><span class="glyph">書</span><div><strong>원문에서 풀이까지</strong><p>64괘 · 384효의 원문과 우리말 번역을 만납니다.</p></div></div>`;
$('#question').addEventListener('input',e=>question=e.target.value);
if($('#toss'))$('#toss').onclick=()=>values.length===6?finish():castOne();if($('#auto'))$('#auto').onclick=castAll;if($('#reset'))$('#reset').onclick=()=>{if(confirm('현재까지 얻은 효를 지우고 새로 시작할까요?')){values=[];faces=[];renderCast()}};if($('#manual-submit'))$('#manual-submit').onclick=()=>{const v=Array.from({length:6},(_,i)=>Number($('#manual-'+i).value));try{Yi.analyze(v);values=v;finish()}catch(e){toast(e.message)}};
}
async function castOne(){if(busy||values.length>=6)return;busy=true;$('#toss').disabled=true;document.querySelectorAll('.coin').forEach(c=>c.classList.add('spinning'));await new Promise(r=>setTimeout(r,520));const t=Yi.toss();values.push(t.value);faces=t.faces;busy=false;if(values.length===6){finish();}else{renderCast();$('#progress').scrollIntoView({block:'center',behavior:'smooth'});}}
async function castAll(){if(busy)return;busy=true;document.querySelectorAll('main button,main textarea').forEach(b=>b.disabled=true);document.querySelectorAll('.coin').forEach(c=>c.classList.add('spinning'));await new Promise(r=>setTimeout(r,520));for(let i=0;i<6;i++){const t=Yi.toss();values.push(t.value);faces=t.faces}busy=false;finish();}
function finish(){current=Yi.analyze(values);recordId=null;memo='';resultTab='reading';renderResult();window.scrollTo({top:0,behavior:'smooth'})}
function readingText(s){const h=byId(s.id);return{h,text:s.kind==='line'?h.lines[s.pos]:s.kind==='use'?h.use:h.judgment,title:s.kind==='line'?lineTitle(h,s.pos):s.kind==='use'?(h.id===1?'용구':'용육'):'괘사'}}
function textCard(h,text,title,priority,meaning){return `<article class="reading-card ${priority?'focus':''}"><h3>${esc(h.name)} · ${esc(title)} ${priority?'<span class="badge red">중심 문장</span>':''}</h3><div class="text-section"><span class="text-label">주역 원문</span><div class="zh" lang="zh-Hant">${esc(text.zh)}</div></div><div class="text-section"><span class="text-label">우리말 번역</span><p class="ko">${esc(text.ko)}</p></div>${meaning?`<div class="interpret"><small>해설 · 현대적 풀이</small>${esc(meaning)}</div>`:''}${title==='괘사'&&h.textNote?`<p class="source-note">이문 안내: ${esc(h.textNote)}</p>`:''}</article>`}
function trigramSummary(id){const bits=Yi.patterns[id-1],lower=Yi.tri[bits.slice(0,3)],upper=Yi.tri[bits.slice(3)];return{lower,upper,html:`<p><span class="serif">${upper[2]} 위 · ${lower[2]} 아래</span><br>상괘 ${upper[0]}(${upper[1]}) : ${upper[3]}<br>하괘 ${lower[0]}(${lower[1]}) : ${lower[3]}</p>`}}
function fullHexagram(h,role){
 const a=current,isBase=role==='base',label=isBase?'본괘':'지괘',chosen=a.selected.filter(x=>x.id===h.id);
 const primary=(kind,pos)=>chosen.some(x=>x.kind===kind&&(pos===undefined||x.pos===pos)&&x.primary);
 return `<section class="full-hex-heading"><div class="full-hex-picture">${hex(isBase?a.bits:a.changed,isBase?a.moving:[])}</div><div><span class="small-label">${label} 전체 · 제 ${h.id}괘</span><h2>${esc(h.name)} <span lang="zh-Hant">${esc(h.hanja)}</span></h2><p>${esc(h.theme)}</p>${trigramSummary(h.id).html}</div></section>
 <p class="full-text-note">${!a.moving.length?'동효가 없어 본괘와 지괘가 같습니다. 같은 괘의 전체 경문을 보여드립니다.':isBase?'처음 얻은 괘의 전체 경문입니다. 동효는 효사 제목에 표시했습니다.':'모든 동효가 변한 뒤의 괘입니다. 지괘의 괘사와 여섯 효사를 모두 읽을 수 있습니다.'}<br>‘중심 문장’은 이번 점의 변점법에 따라 표시하며, 나머지 문장도 전체 맥락을 살피도록 함께 수록합니다.</p>
 <p class="section-label">${label}의 괘사 · 원문과 번역, 전체 해설</p>${textCard(h,h.judgment,'괘사',primary('judgment'),h.meaning)}
 <p class="section-label">${label}의 여섯 효사 · 초효에서 상효까지</p>${h.lines.map((l,i)=>textCard(h,l,lineTitle(h,i)+(isBase&&a.moving.includes(i)?' · 동효':''),primary('line',i),l.meaning)).join('')}
 ${h.use?textCard(h,h.use,h.id===1?'용구':'용육',primary('use'),h.use.meaning):''}
 <p class="source"><a rel="noopener" href="${esc(h.source)}">${esc(h.name)} 원문 출처 ↗</a></p>`;
}
function resultBody(){const a=current,b=byId(a.base),t=byId(a.target);if(resultTab==='reading'){const priority=a.selected.find(s=>s.primary);const r=readingText(priority);return `<p class="section-label">얻은 괘의 원문 · 번역 · 해설</p>${textCard(b,b.judgment,'괘사',a.selected.some(x=>x.id===b.id&&x.kind==='judgment'&&x.primary),b.meaning)}<button class="full-text-link" data-tab="base">본괘 전체 읽기 · 괘사와 여섯 효사 →</button>${a.base!==a.target?`<p class="section-label">변화한 지괘의 원문 · 번역 · 해설</p>${textCard(t,t.judgment,'괘사',a.selected.some(x=>x.id===t.id&&x.kind==='judgment'&&x.primary),t.meaning)}<button class="full-text-link" data-tab="target">지괘 전체 읽기 · 괘사와 여섯 효사 →</button>`:''}<p class="section-label">동효에 따른 읽기${a.moving.length?' · 동효 '+a.moving.length+'개':' · 동효 없음'}</p><p class="rule-inline">${esc(a.rule)}</p>${a.selected.filter(x=>x.kind!=='judgment').sort((x,y)=>Number(y.primary)-Number(x.primary)).map(s=>{const r=readingText(s);return textCard(r.h,r.text,r.title,s.primary,r.text.meaning||r.h.meaning)}).join('')}<article class="reading-card"><h3>괘의 흐름을 헤아리기</h3><p class="ko">${esc(b.meaning)}</p>${a.base!==a.target?`<p class="interpret"><small>변화한 형상 · ${esc(t.name)}</small>${esc(t.meaning)}</p>`:''}<p class="source-note">지괘는 변화의 방향을 살펴보는 형상이며, 확정된 미래를 뜻하지 않습니다.</p></article><article class="reading-card"><h3>내 물음에 비추어 보기</h3>${question?`<p class="ko">“${esc(question)}”</p>`:''}<p class="ko">중심 문장의 “${esc(r.text.ko)}”를 지금의 상황에 대입해 보세요. 이 말과 맞닿는 사실은 무엇이며, 먼저 바꿀 수 있는 작은 행동은 무엇인가요?</p><p class="source-note">이 풀이는 수록된 괘·효 해설과 변점 규칙을 조합합니다. 질문 내용을 분석하는 생성형 AI 상담은 아닙니다.</p></article>`}
if(resultTab==='base'||resultTab==='target')return fullHexagram(resultTab==='base'?b:t,resultTab);
return `<article class="reading-card"><h3>오늘의 물음, 나의 문장</h3><p class="source-note">괘를 읽으며 떠오른 생각과 실제로 해볼 행동을 남겨보세요.</p><label class="journal-label" for="memo">해석 메모</label><textarea id="memo" maxlength="3000" rows="8" placeholder="무엇이 마음에 남았나요? 지금 할 수 있는 행동은 무엇인가요?">${esc(memo)}</textarea><p class="source-note">기록은 이 기기의 앱에 저장됩니다. 다른 기기와 동기화되지 않으며, 앱을 삭제하거나 앱 데이터를 지우면 사라집니다.</p><button class="primary" id="save-memo">${recordId?'기록 업데이트':'괘와 메모 저장'}</button></article>`}
function renderResult(){const a=current,b=byId(a.base),t=byId(a.target);main.innerHTML=`<div class="reveal"><div class="result-top"><span class="eyebrow">나의 주역 · 괘를 읽는 시간</span><button class="secondary" id="save">${recordId?'저장된 기록':'이 괘 저장하기'}</button></div><div class="result-name"><span class="small-label">동전으로 얻은 본괘 · 제 ${b.id}괘</span><h1>${esc(b.name)} <span>${esc(b.hanja)}</span></h1><p>${esc(b.theme)}</p></div><div class="question-box"><small>오늘의 물음</small><p>${esc(question||'지금 나에게 필요한 방향은 무엇일까요?')}</p></div><div class="pair"><section class="hex-card">${hex(a.bits,a.moving)}<div><span class="badge">본괘 · 현재의 형상</span><h2>${esc(b.name)}<span class="cn-name">${esc(b.hanja)}</span></h2><p>제 ${b.id} 괘 · ${esc(b.theme)}</p></div></section><div class="pair-arrow">${a.moving.length?'→':'='}</div><section class="hex-card">${hex(a.changed)}<div><span class="badge">${a.moving.length?'지괘 · 변화한 형상':'동효 없음 · 본괘 유지'}</span><h2>${esc(t.name)}<span class="cn-name">${esc(t.hanja)}</span></h2><p>제 ${t.id} 괘 · ${esc(t.theme)}</p></div></section></div><div class="tabs result-tabs" role="tablist" aria-label="괘 해석과 전체 경문">${[['reading','핵심 해석'],['base','본괘 전체'],['target','지괘 전체'],['memo','나의 메모']].map(([key,label])=>`<button id="tab-${key}" role="tab" aria-controls="reading-body" aria-selected="${resultTab===key}" data-tab="${key}" class="${resultTab===key?'on':''}">${label}</button>`).join('')}</div><div class="reading-grid"><section class="reading-body" id="reading-body" role="tabpanel" aria-labelledby="tab-${resultTab}">${resultBody()}</section><aside><div class="side-card"><h3>이번 점의 읽기 기준</h3><span class="badge red">동효 ${a.moving.length}개</span><p>${esc(a.rule)}</p><p>${a.moving.length?'변하는 자리: '+a.moving.map(p=>posNames[p]).join(' · '):'여섯 효가 모두 정효입니다.'}</p><button class="text-button" data-page="guide">변점법 자세히 보기 ↗</button></div><div class="side-card"><h3>괘의 형태 · ${esc(b.name)}</h3>${trigramSummary(b.id).html}<p class="source-note">형상을 읽는 상징적 단서입니다. 위아래 삼효를 각각 상괘·하괘라고 합니다.</p></div><p class="source-note">기괘: ${mode==='manual'?'직접 입력':'세 동전법'}<br>효 값(아래→위): ${a.values.join(' · ')}<br>해석 기준: 주희 계열 변점법<br>경문 범위: 괘사·효사·용구·용육</p><p class="source-note">번역과 현대적 풀이는 앱을 위해 작성한 초역으로, 전문 역주자의 감수를 거치지 않았습니다.</p></aside></div><div class="bottom-actions"><button class="secondary" id="new-reading">새로운 물음으로 시작</button><button class="primary" id="save-bottom">${recordId?'기록 업데이트':'이 괘 저장하기'}</button></div></div>`;$('#save').onclick=saveRecord;$('#save-bottom').onclick=saveRecord;$('#new-reading').onclick=()=>{values=[];faces=[];question='';current=null;recordId=null;memo='';setPage('cast')};bindMemo();}
function bindMemo(){if($('#memo'))$('#memo').oninput=e=>memo=e.target.value;if($('#save-memo'))$('#save-memo').onclick=saveRecord;}
function saveRecord(){if(!current)return;const id=recordId||Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>b.toString(16).padStart(2,'0')).join(''),existing=records.find(r=>r.id===id),next={id,created:existing?.created||new Date().toISOString(),question,values:current.values,mode,memo,ruleVersion:'zhu-xi-1',textVersion:'2026-10-30'};const updated=existing?records.map(r=>r.id===id?next:r):[next,...records];try{localStorage.setItem('gwan-records-v1',JSON.stringify(updated));records=updated;recordId=id;count();toast(existing?'기록을 업데이트했습니다.':'괘를 나의 기록에 저장했습니다.');$('#save').textContent='저장된 기록';$('#save-bottom').textContent='기록 업데이트';if($('#save-memo'))$('#save-memo').textContent='기록 업데이트'}catch{toast('브라우저 저장 공간을 사용할 수 없습니다.')}}
function renderLibrary(){main.innerHTML=`<section class="page-head"><div class="eyebrow">주역의 문장들</div><h1>64괘 사전</h1><p>괘의 형태부터 괘사·효사의 원문과 번역까지, 한 괘씩 천천히 읽어보세요.</p></section><div class="toolbar"><input id="search" class="search" type="search" placeholder="괘 이름, 한자 또는 번호 검색" aria-label="괘 검색" value="${esc(search)}"><span class="small-label" id="search-count"></span></div><div class="catalog" id="catalog"></div>`;$('#search').oninput=e=>{search=e.target.value;renderCatalog()};renderCatalog()}
function renderCatalog(){const q=search.trim().toLowerCase(),items=DATA.filter(h=>!q||h.name.includes(q)||h.hanja.includes(q)||h.theme.includes(q)||String(h.id)===q);$('#search-count').textContent=items.length+'괘';$('#catalog').innerHTML=items.length?items.map(h=>`<button class="catalog-card" data-hex="${h.id}">${hex(Yi.patterns[h.id-1].split('').map(Number))}<span><small>${String(h.id).padStart(2,'0')} · ${esc(h.hanja)}</small><strong>${esc(h.name)}</strong><p>${esc(h.theme)}</p></span></button>`).join(''):'<p class="source-note">일치하는 괘가 없습니다. 다른 이름이나 번호로 찾아보세요.</p>'}
function renderHex(id){const h=byId(id),bits=Yi.patterns[id-1].split('').map(Number);main.innerHTML=`<div class="result-top"><button class="text-button" data-page="library">← 64괘 사전</button><span class="small-label">제 ${id} 괘</span></div><div class="hex-card" style="max-width:600px;margin-bottom:28px">${hex(bits)}<div><span class="small-label">${esc(h.theme)}</span><h2>${esc(h.name)} <span class="cn-name">${esc(h.hanja)}</span></h2>${trigramSummary(id).html}</div></div><div class="reading-grid"><section>${textCard(h,h.judgment,'괘사',false,h.meaning)}${h.lines.map((l,i)=>textCard(h,l,lineTitle(h,i),false,l.meaning)).join('')}${h.use?textCard(h,h.use,id===1?'용구':'용육',false,h.use.meaning):''}<p class="source"><a href="${esc(h.source)}" rel="noopener">위키문헌의 주역 원문 보기 ↗</a></p></section><aside><div class="side-card"><h3>경문을 읽는 순서</h3><p>괘사는 한 괘의 전체 뜻을, 효사는 각 자리에서의 상황을 말합니다. 효는 아래의 초효부터 위의 상효까지 읽습니다.</p><p>여기의 6·9는 효의 음양을 부르는 명칭입니다. 사전에서 모든 효가 동효라는 뜻은 아닙니다.</p></div><p class="source-note">고전 경문은 공유 저작물입니다. 한국어 번역과 현대적 풀이는 자체 작성한 초역입니다. 십익 전체는 수록하지 않았습니다.</p></aside></div><div class="bottom-actions">${id>1?`<button class="secondary" data-hex="${id-1}">← 이전 괘</button>`:''}${id<64?`<button class="secondary" data-hex="${id+1}">다음 괘 →</button>`:''}</div>`;window.scrollTo({top:0,behavior:'instant'})}
function renderHistory(){main.innerHTML=`<section class="page-head"><div class="eyebrow">물음이 쌓이는 곳</div><h1>나의 기록</h1><p>그날의 물음과 괘, 시간이 지나 달리 보이는 문장을 간직하세요. 이 기기의 앱에만 저장됩니다.</p></section>${records.length?records.map(r=>{const a=Yi.analyze(r.values),b=byId(a.base),t=byId(a.target);return `<article class="history-row">${hex(a.bits)}<div class="history-info"><small>${new Date(r.created).toLocaleString('ko-KR')}</small><p>${esc(r.question||'지금 나에게 필요한 방향')}</p><strong>${esc(b.name)} ${a.moving.length?'→ '+esc(t.name):'· 동효 없음'}</strong><small> · 동효 ${a.moving.length}개</small></div><button class="secondary" data-record="${esc(r.id)}">기록 읽기</button><button class="text-button" data-delete="${esc(r.id)}" aria-label="기록 삭제">삭제</button></article>`}).join(''):`<div class="empty-state"><div class="empty-icon">冊</div><h2>아직 남겨둔 물음이 없어요</h2><p>점을 보고 ‘이 괘 저장하기’를 누르면 여기에 모입니다.</p><button class="primary" data-page="cast">첫 물음 시작하기</button></div>`}`}
function renderGuide(){main.innerHTML=`<section class="page-head"><div class="eyebrow">괘를 얻고 읽는 법</div><h1>점법 안내</h1><p>기괘 방법과 해석 규칙을 분명히 알고, 한 문장씩 읽습니다.</p></section><div class="guide"><article class="reading-card"><h3>1. 세 동전으로 여섯 효를 얻기</h3><p>마음속에 한 가지 물음을 정한 뒤, 같은 동전 세 개를 여섯 번 던집니다. 이 앱은 A면을 2점, B면을 3점으로 정합니다. 실제 동전을 쓸 때도 시작 전에 두 면의 배점을 정하고 끝까지 유지하세요.</p><p>첫 번째 결과는 가장 아래인 초효, 마지막 결과는 가장 위인 상효입니다. 화면에는 위에서 상효부터 표시되지만, 효는 아래에서 위로 쌓습니다.</p><table><thead><tr><th>합계</th><th>효</th><th>변화</th><th>확률</th></tr></thead><tbody><tr><td>6</td><td>노음 老陰</td><td>음 → 양 · ×</td><td>1/8</td></tr><tr><td>7</td><td>소양 少陽</td><td>양 · 불변</td><td>3/8</td></tr><tr><td>8</td><td>소음 少陰</td><td>음 · 불변</td><td>3/8</td></tr><tr><td>9</td><td>노양 老陽</td><td>양 → 음 · ○</td><td>1/8</td></tr></tbody></table><p>디지털 동전은 브라우저의 암호학적 난수로 각 면을 동일 확률로 뽑습니다. ‘여섯 번 한 번에’도 동일한 방법으로 독립된 여섯 번의 결과를 만듭니다. 이 동전법은 시초 49개를 세는 대연서법과 확률이 다릅니다.</p></article><article class="reading-card"><h3>2. 본괘, 동효, 지괘</h3><p><b>본괘</b>는 처음 얻은 여섯 효의 형상입니다. 값이 6 또는 9인 효가 <b>동효</b>입니다. 모든 동효의 음양을 동시에 바꾸고 나머지를 유지하면 <b>지괘(之卦)</b>가 됩니다. 동효가 없으면 두 괘는 같습니다.</p><p>예를 들어 아래부터 9·7·7·7·7·7이면 중천건의 초구가 변하여 천풍구가 됩니다. 지괘는 변화한 형상이며, 미래의 사건을 확정하는 예언으로 읽지는 않습니다.</p></article><article class="reading-card"><h3>3. 동효 수에 따른 변점법</h3><p>주희의 《역학계몽》 계열 변점법을 적용합니다. 주역 점법 전체에 공통된 유일한 규칙은 아니며, 납갑육효의 세응·육친·월건·일진을 적용하는 방식과도 다릅니다. 여기서 괘사는 십익의 단전이 아닌 괘 아래의 경문입니다.</p><table><thead><tr><th>동효</th><th>읽을 문장</th></tr></thead><tbody><tr><td>0개</td><td>본괘의 괘사</td></tr><tr><td>1개</td><td>본괘 해당 동효의 효사</td></tr><tr><td>2개</td><td>본괘의 두 동효 효사, 위쪽을 중심으로</td></tr><tr><td>3개</td><td>본괘·지괘의 괘사, 전십괘는 본괘·후십괘는 지괘 중심</td></tr><tr><td>4개</td><td>지괘의 두 불변 자리 효사, 아래쪽을 중심으로</td></tr><tr><td>5개</td><td>지괘의 한 불변 자리 효사</td></tr><tr><td>6개</td><td>건은 용구, 곤은 용육. 나머지는 지괘 괘사</td></tr></tbody></table><p>삼효가 변하는 조합은 20개입니다. 초효를 포함하는 전반 열 조합(123·124·125·126·134·135·136·145·146·156)은 본괘를, 나머지 열 조합은 지괘를 중심으로 함께 읽습니다. 숫자는 아래부터 세는 효의 자리입니다.</p><p class="source"><a href="https://zh.wikisource.org/wiki/易學啟蒙通釋_(四庫全書本)/卷下" rel="noopener">《역학계몽통석》 권하 · 변점 규칙 원문 ↗</a></p></article><article class="reading-card"><h3>4. 원문 · 번역 · 현대적 풀이</h3><p><b>원문:</b> 위키문헌에 공개된 《주역》의 괘사 64편, 효사 384편 및 용구·용육을 바탕으로 수록했습니다. 고전 원문은 공공영역에 속합니다. 괘마다 원문 페이지를 연결해 두었습니다. 단전·상전·문언전 등 십익 전체를 수록한 완역본은 아닙니다.</p><p><b>번역:</b> 이 앱을 위해 작성한 현대 한국어 초역입니다. 貞은 대체로 ‘바름을 지킴’, 孚는 ‘믿음’으로 풀었으며, 고대 점서 문맥이나 다른 역주와는 해석이 다를 수 있습니다. 전문 역주자의 감수를 거치지 않았습니다.</p><p><b>현대적 풀이:</b> 괘와 효의 상징을 오늘의 태도와 행동에 비추어 작성한 해설입니다. 전통 주석의 직접 인용이나 질문별 생성형 AI 답변이 아닙니다. 질문은 스스로 해석을 대조할 수 있도록 함께 표시합니다.</p><p class="source"><a href="https://zh.wikisource.org/wiki/周易" rel="noopener">위키문헌 《주역》 ↗</a> · <a href="https://creativecommons.org/licenses/by-sa/4.0/" rel="noopener">위키문헌 편집물 이용조건 ↗</a></p></article><article class="reading-card"><h3>5. 기록을 간직하기</h3><p>결과 화면의 ‘이 괘 저장하기’를 누르면 질문, 여섯 효의 값, 점법과 메모를 이 기기의 앱에 저장합니다. 기기 간 동기화는 제공하지 않습니다. 앱을 삭제하거나 앱 데이터를 지우면 기록이 사라집니다.</p><p>괘는 상황을 돌아보는 전통적 성찰 도구로 활용하세요. 실제 행동은 관찰한 사실과 자신의 판단을 함께 바탕으로 정합니다.</p></article></div>`}
document.addEventListener('click',e=>{const b=e.target.closest('button,a.brand');if(!b)return;if(b.matches('a.brand')){e.preventDefault();setPage('cast')}else if(b.dataset.page)setPage(b.dataset.page);else if(b.dataset.mode){if(values.length||busy)return;mode=b.dataset.mode;renderCast()}else if(b.dataset.tab){resultTab=b.dataset.tab;renderResult();$('.result-tabs').scrollIntoView({block:'start',behavior:'instant'});$('#tab-'+resultTab).focus({preventScroll:true})}else if(b.dataset.hex)renderHex(Number(b.dataset.hex));else if(b.dataset.record){const r=records.find(r=>r.id===b.dataset.record);if(r){values=[...r.values];question=r.question||'';memo=r.memo||'';mode=r.mode;recordId=r.id;current=Yi.analyze(values);resultTab='reading';renderResult();window.scrollTo({top:0,behavior:'instant'})}}else if(b.dataset.delete){if(confirm('이 점괘와 메모를 삭제할까요?')){const next=records.filter(r=>r.id!==b.dataset.delete);try{localStorage.setItem('gwan-records-v1',JSON.stringify(next));records=next;count();renderHistory();toast('기록을 삭제했습니다.')}catch{toast('기록을 삭제하지 못했습니다.')}}}});
if(!Array.isArray(DATA)||DATA.length!==64)main.innerHTML='<p>원문 데이터를 불러오지 못했습니다. 페이지를 새로고침해 주세요.</p>';else renderCast();
</script></body></html>
