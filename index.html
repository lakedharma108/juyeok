<script>(function(root){
const patterns=['111111','000000','100010','010001','111010','010111','010000','000010','111011','110111','111000','000111','101111','111101','001000','000100','100110','011001','110000','000011','100101','101001','000001','100000','100111','111001','100001','011110','010010','101101','001110','011100','001111','111100','000101','101000','101011','110101','001010','010100','110001','100011','111110','011111','000110','011000','010110','011010','101110','011101','100100','001001','001011','110100','101100','001101','011011','110110','010011','110010','110011','001100','101010','010101'];
const tri={'111':['건','乾','하늘','굳셈과 창조'],'000':['곤','坤','땅','포용과 수용'],'100':['진','震','우레','움직임과 시작'],'010':['감','坎','물','위험과 깊이'],'001':['간','艮','산','멈춤과 경계'],'011':['손','巽','바람','스며듦과 순응'],'101':['리','離','불','밝음과 의지'],'110':['태','兌','못','기쁨과 소통']};
function analyze(values){
 if(!Array.isArray(values)||values.length!==6||!values.every(v=>[6,7,8,9].includes(v)))throw Error('초효부터 상효까지 6·7·8·9 중 하나로 입력해 주세요.');
 const moving=values.flatMap((v,i)=>v===6||v===9?[i]:[]), still=values.flatMap((v,i)=>v===7||v===8?[i]:[]);
 const bits=values.map(v=>v%2), changed=bits.map((v,i)=>moving.includes(i)?1-v:v);
 const base=patterns.indexOf(bits.join(''))+1, target=patterns.indexOf(changed.join(''))+1;
 let selected=[],rule=''; const item=(id,kind,pos,primary=true)=>({id,kind,pos,primary});
 switch(moving.length){
 case 0:selected=[item(base,'judgment')];rule='동효가 없으므로 본괘의 괘사를 중심으로 읽습니다.';break;
 case 1:selected=[item(base,'line',moving[0])];rule='동효가 하나이므로 본괘의 해당 효사를 읽습니다.';break;
 case 2:selected=moving.map((p,i)=>item(base,'line',p,i===1));rule='본괘의 두 동효를 함께 읽되, 위쪽 효사를 중심으로 읽습니다.';break;
 case 3:{const baseMain=moving.includes(0);selected=[item(base,'judgment',undefined,baseMain),item(target,'judgment',undefined,!baseMain)];rule='본괘와 지괘의 괘사를 함께 읽습니다. 변효 조합의 '+(baseMain?'전십괘에 해당하여 본괘':'후십괘에 해당하여 지괘')+'를 중심으로 읽습니다.';break;}
 case 4:selected=still.map((p,i)=>item(target,'line',p,i===0));rule='지괘에서 변하지 않은 두 자리의 효사를 읽되, 아래쪽 효사를 중심으로 읽습니다.';break;
 case 5:selected=[item(target,'line',still[0])];rule='지괘에서 변하지 않은 한 자리의 효사를 읽습니다.';break;
 case 6:if(base===1||base===2){selected=[item(base,'use')];rule='여섯 효가 모두 변한 '+(base===1?'건괘는 용구':'곤괘는 용육')+'를 읽습니다.';}else{selected=[item(target,'judgment')];rule='여섯 효가 모두 변하므로 지괘의 괘사를 읽습니다.';}break;
 }
 return{values:[...values],bits,changed,base,target,moving,selected,rule};
}
function toss(){const bytes=new Uint8Array(3);crypto.getRandomValues(bytes);const faces=Array.from(bytes,b=>2+(b&1));return{faces,value:faces.reduce((a,b)=>a+b,0)};}
const api={patterns,tri,analyze,toss};if(typeof module!=='undefined')module.exports=api;root.Yi=api;
})(typeof window!=='undefined'?window:globalThis);
</script><script>window.HEXAGRAMS = [{"id": 1, "name": "중천건", "hanja": "乾", "theme": "창조와 꾸준한 실천", "judgment": {"zh": "乾：元亨。利貞。", "ko": "건은 크게 형통하다. 바르게 지킴이 이롭다."}, "lines": [{"zh": "初九：潛龍勿用。", "ko": "잠겨 있는 용이니, 아직 쓰지 말라.", "meaning": "능력이 있어도 드러낼 때가 아닐 수 있습니다. 기초를 다지십시오."}, {"zh": "九二：見龍在田，利見大人。", "ko": "용이 밭에 나타나니, 큰 덕을 갖춘 사람을 만나는 것이 이롭다.", "meaning": "경험 있는 사람과 만나 방향을 점검하십시오."}, {"zh": "九三：君子終日乾乾，夕惕若；厲，无咎。", "ko": "군자가 종일 힘쓰고 저녁에도 삼가 경계하니, 위태로우나 허물은 없다.", "meaning": "성실함과 점검을 함께 유지하면 전환기의 실수를 줄일 수 있습니다."}, {"zh": "九四：或躍在淵，无咎。", "ko": "혹 뛰어오르기도 하고 깊은 못에 있기도 하니, 허물이 없다.", "meaning": "진출과 준비 사이에서 실제 여건에 맞는 선택을 하십시오."}, {"zh": "九五：飛龍在天，利見大人。", "ko": "나는 용이 하늘에 있으니, 큰 덕을 갖춘 사람을 만나는 것이 이롭다.", "meaning": "영향력이 커질수록 좋은 조언과 협력이 필요합니다."}, {"zh": "上九：亢龍，有悔。", "ko": "너무 높이 오른 용이니, 후회가 있다.", "meaning": "정점에서 더 밀어붙이기보다 물러날 때를 살피십시오."}], "meaning": "하늘의 굳센 움직임처럼 스스로 힘쓰고 때에 맞게 행동하는 괘입니다. 추진력만 믿지 말고 자신의 준비와 위치를 살피십시오.", "source": "https://zh.wikisource.org/wiki/周易/乾", "use": {"zh": "用九：見羣龍无首，吉。", "ko": "여러 용이 나타나되 앞장서 우두머리가 되려는 것이 없으면 길하다.", "meaning": "힘을 독점하지 않고 역할을 나누는 태도로 전환하십시오."}}, {"id": 2, "name": "중지곤", "hanja": "坤", "theme": "포용과 성실한 뒷받침", "judgment": {"zh": "坤：元亨。利牝馬之貞。君子有攸往，先迷後得主。利西南得朋，東北喪朋。安貞，吉。", "ko": "곤은 크게 형통하다. 암말처럼 바르게 지키는 것이 이롭다. 군자가 갈 곳이 있을 때 앞서면 헤매고 뒤따르면 주인을 얻는다. 서남에서는 벗을 얻고 동북에서는 벗을 잃는다. 편안히 바름을 지키면 길하다."}, "lines": [{"zh": "初六：履霜，堅冰至。", "ko": "서리를 밟으니, 단단한 얼음이 이를 것이다.", "meaning": "작은 징후를 일찍 알아차리고 대비하십시오."}, {"zh": "六二：直方大，不習无不利。", "ko": "곧고 반듯하며 크니, 억지로 익히지 않아도 이롭지 않음이 없다.", "meaning": "기본 원칙과 정직한 태도가 자연스럽게 힘을 발휘합니다."}, {"zh": "六三：含章，可貞。或從王事，无成有終。", "ko": "아름다움을 안에 품고 바르게 지킬 수 있다. 혹 왕의 일을 따르더라도 공을 자기 것으로 삼지 않고 끝맺음이 있다.", "meaning": "실력을 자랑하기보다 공동의 일을 끝까지 완수하십시오."}, {"zh": "六四：括囊，无咎无譽。", "ko": "주머니를 묶으니, 허물도 없고 칭찬도 없다.", "meaning": "말과 행동을 절제하고 불필요한 노출을 줄이십시오."}, {"zh": "六五：黃裳，元吉。", "ko": "누런 아래옷이니, 크게 길하다.", "meaning": "중심을 지키되 겸손한 자세로 역할을 수행하십시오."}, {"zh": "上六：龍戰于野，其血玄黃。", "ko": "용들이 들에서 싸우니, 그 피가 검고 누렇다.", "meaning": "역할과 힘을 다투는 충돌이 모두를 소모시킬 수 있습니다."}], "meaning": "땅처럼 받아들이고 길러 내는 힘을 말합니다. 주도권을 서둘러 쥐기보다 상황을 이해하고 맡은 일을 꾸준히 완수하십시오.", "source": "https://zh.wikisource.org/wiki/周易/坤", "use": {"zh": "用六：利永貞。", "ko": "오래도록 바름을 지키는 것이 이롭다.", "meaning": "상황이 크게 변해도 일관된 원칙을 유지하십시오."}}, {"id": 3, "name": "수뢰둔", "hanja": "屯", "theme": "시작의 어려움", "judgment": {"zh": "屯：元亨，利貞。勿用有攸往，利建侯。", "ko": "둔은 크게 형통하며 바르게 지킴이 이롭다. 성급히 나아가지 말고, 돕는 지도자를 세우는 것이 이롭다."}, "lines": [{"zh": "初九：磐桓，利居貞，利建侯。", "ko": "머뭇거리니, 자리를 지켜 바르게 함이 이롭고 돕는 지도자를 세움이 이롭다.", "meaning": "서두르지 말고 신뢰할 수 있는 사람과 기반을 만드십시오."}, {"zh": "六二：屯如邅如，乘馬班如，匪寇婚媾，女子貞不字，十年乃字。", "ko": "어려워 맴돌고 말을 타고도 나아가지 못한다. 도적이 아니라 혼인을 구하는 이다. 여자가 바름을 지켜 혼인하지 않다가 십 년이 되어서야 혼인한다.", "meaning": "장애와 호의를 구분하고 관계가 성숙할 시간을 두십시오."}, {"zh": "六三：即鹿无虞，惟入于林中，君子幾不如舍，往吝。", "ko": "사냥 안내자 없이 사슴을 쫓으면 숲속으로 들어갈 뿐이다. 군자는 기미를 알아 그만두는 것만 못함이 없으니, 가면 곤란하다.", "meaning": "정보나 안내가 부족한 일은 욕심을 내려놓고 멈추십시오."}, {"zh": "六四：乘馬班如，求婚媾，往，吉无不利。", "ko": "말을 타고 머뭇거리나 혼인을 구하여 나아가면 길하고 이롭지 않음이 없다.", "meaning": "적절한 협력 요청을 받아들이고 관계를 연결하십시오."}, {"zh": "九五：屯其膏；小貞吉，大貞凶。", "ko": "은택을 널리 펴지 못한다. 작은 일에 바름을 지키면 길하고 큰 일을 고집하면 흉하다.", "meaning": "가용 자원에 맞게 규모를 줄이고 작은 성과부터 쌓으십시오."}, {"zh": "上六：乘馬班如，泣血漣如。", "ko": "말을 타고도 맴돌며 피눈물을 줄줄 흘린다.", "meaning": "막힌 방식에 매달리지 말고 도움을 구하거나 방향을 바꾸십시오."}], "meaning": "새로운 일이 싹트지만 질서와 자원이 아직 갖추어지지 않은 때입니다. 무리한 확장보다 기반과 협력자를 마련하는 데 힘을 쓰십시오.", "source": "https://zh.wikisource.org/wiki/周易/屯"}, {"id": 4, "name": "산수몽", "hanja": "蒙", "theme": "배움과 올바른 질문", "judgment": {"zh": "蒙：亨。匪我求童蒙，童蒙求我。初筮告，再三瀆，瀆則不告。利貞。", "ko": "몽은 형통하다. 내가 어린 몽매한 이를 찾는 것이 아니라 그가 나를 찾는다. 처음 점치면 알려 주지만 두세 번 거듭하여 모독하면 알려 주지 않는다. 바르게 지킴이 이롭다."}, "lines": [{"zh": "初六：發蒙，利用刑人，用說桎梏，以往吝。", "ko": "몽매함을 깨우치려면 규율로 사람을 바로잡고 질곡을 벗겨 주는 것이 이롭다. 그 방식만 계속 밀고 가면 곤란하다.", "meaning": "규칙은 배우도록 돕는 수단이어야 하며 강압에 머물러서는 안 됩니다."}, {"zh": "九二：包蒙吉，納婦吉，子克家。", "ko": "몽매한 이를 포용하면 길하고 아내를 맞아들여도 길하다. 아들이 집안을 감당한다.", "meaning": "부족한 사람을 품으면서 책임 있게 이끌어 주십시오."}, {"zh": "六三：勿用取女，見金夫，不有躬，无攸利。", "ko": "그런 여자와 혼인하지 말라. 부유한 남자를 보고 자신을 지키지 못하니 이로울 것이 없다.", "meaning": "겉으로 보이는 이익 때문에 자신의 기준을 잃는 관계를 경계하십시오."}, {"zh": "六四：困蒙，吝。", "ko": "몽매함에 갇혀 있으니 곤란하다.", "meaning": "혼자 확신하기보다 질문하고 새로운 근거를 접하십시오."}, {"zh": "六五：童蒙，吉。", "ko": "어린아이처럼 배우려는 몽매함이니 길하다.", "meaning": "직위나 경험에 매이지 말고 열린 마음으로 배우십시오."}, {"zh": "上九：擊蒙，不利為寇，利禦寇。", "ko": "몽매함을 치되 남을 침범하는 것이 이롭지 않고 침범을 막는 것이 이롭다.", "meaning": "잘못을 바로잡되 상대를 해치는 공격이 되지 않도록 하십시오."}], "meaning": "알지 못함을 인정하고 성실히 배우는 자세가 중요합니다. 원하는 답이 나올 때까지 되묻기보다 한 번 얻은 가르침을 실제로 검토하십시오.", "source": "https://zh.wikisource.org/wiki/周易/蒙"}, {"id": 5, "name": "수천수", "hanja": "需", "theme": "준비하며 기다림", "judgment": {"zh": "需：有孚，光亨。貞吉，利涉大川。", "ko": "수는 믿음이 있으면 밝게 형통하다. 바르게 지키면 길하며 큰 강을 건너는 것이 이롭다."}, "lines": [{"zh": "初九：需于郊，利用恆，无咎。", "ko": "들판에서 기다린다. 한결같음을 지키는 것이 이로우며 허물이 없다.", "meaning": "위험과 거리를 두고 평소의 준비를 이어 가십시오."}, {"zh": "九二：需于沙，小有言，終吉。", "ko": "모래밭에서 기다린다. 작은 구설이 있으나 끝내 길하다.", "meaning": "사소한 비판에 흔들리지 말고 중심을 유지하십시오."}, {"zh": "九三：需于泥，致寇至。", "ko": "진흙에서 기다리니 도적이 오게 만든다.", "meaning": "위험에 너무 가까이 접근했는지 점검하십시오."}, {"zh": "六四：需于血，出自穴。", "ko": "피 흘리는 곳에서 기다리다가 구덩이에서 나온다.", "meaning": "대립을 고집하지 말고 안전하게 벗어날 길을 찾으십시오."}, {"zh": "九五：需于酒食，貞吉。", "ko": "술과 음식으로 기다린다. 바르게 지키면 길하다.", "meaning": "여유가 있을 때 몸과 관계를 돌보되 방심하지 마십시오."}, {"zh": "上六：入于穴，有不速之客三人來，敬之終吉。", "ko": "구덩이에 들어가니 부르지 않은 손님 셋이 온다. 공경히 대하면 끝내 길하다.", "meaning": "예상 밖의 만남이나 도움을 열린 태도로 살펴보십시오."}], "meaning": "앞에 위험이 있을 때 힘만으로 돌파하지 않고 때를 기다리는 지혜입니다. 기다리는 동안 체력과 자원을 갖추면 기회가 왔을 때 움직일 수 있습니다.", "source": "https://zh.wikisource.org/wiki/周易/需"}, {"id": 6, "name": "천수송", "hanja": "訟", "theme": "다툼의 절제", "judgment": {"zh": "訟：有孚，窒，惕，中吉，終凶。利見大人，不利涉大川。", "ko": "송은 진실함이 있어도 막혀 두렵다. 중도에서 그치면 길하고 끝까지 다투면 흉하다. 큰 덕을 갖춘 사람을 만나는 것이 이롭고 큰 강을 건너는 것은 이롭지 않다."}, "lines": [{"zh": "初六：不永所事，小有言，終吉。", "ko": "다투는 일을 오래 끌지 않으면 작은 구설이 있어도 끝내 길하다.", "meaning": "초기에 쟁점을 좁히고 매듭지으십시오."}, {"zh": "九二：不克訟，歸而逋，其邑人三百戶无眚。", "ko": "다툼을 이기지 못하여 돌아와 피하면 그 고을 삼백 가구에 재앙이 없다.", "meaning": "이기기 어려운 싸움에서 물러나는 것이 주변 사람을 지킬 수 있습니다."}, {"zh": "六三：食舊德，貞厲，終吉。或從王事，无成。", "ko": "예전의 덕으로 살아가며 바르게 지켜도 위태로우나 끝내 길하다. 혹 왕의 일을 따르더라도 공을 자기 것으로 삼지 않는다.", "meaning": "기존의 기반을 지키고 공로 경쟁을 삼가십시오."}, {"zh": "九四：不克訟，復即命渝，安貞吉。", "ko": "다툼을 이기지 못하니 돌아와 명에 따르고 마음을 바꾼다. 편안히 바름을 지키면 길하다.", "meaning": "판세를 인정하고 태도를 수정하면 안정의 길이 열립니다."}, {"zh": "九五：訟，元吉。", "ko": "다툼을 바르게 판별하니 크게 길하다.", "meaning": "사사로운 감정보다 공정한 기준과 사실에 따르십시오."}, {"zh": "上九：或錫之鞶帶，終朝三褫之。", "ko": "혹 큰 띠를 상으로 받더라도 한나절에 세 번 빼앗긴다.", "meaning": "다툼으로 얻은 승리와 지위는 오래가지 않을 수 있습니다."}], "meaning": "자기 말이 옳다는 확신만으로 갈등을 끝까지 밀어붙이지 말라는 괘입니다. 공정한 중재와 조정 가능성을 살피고 다툼의 비용을 따져 보십시오.", "source": "https://zh.wikisource.org/wiki/周易/訟"}, {"id": 7, "name": "지수사", "hanja": "師", "theme": "조직과 책임", "judgment": {"zh": "師：貞丈人吉，无咎。", "ko": "사는 바르게 지켜야 한다. 노련하고 덕 있는 어른이 이끌면 길하고 허물이 없다."}, "lines": [{"zh": "初六：師出以律，否臧，凶。", "ko": "군대는 규율에 따라 출동해야 한다. 규율이 바르지 못하면 흉하다.", "meaning": "일을 시작하기 전에 역할과 기준을 분명히 하십시오."}, {"zh": "九二：在師中吉，无咎；王三錫命。", "ko": "군대의 중심에서 중도를 지키면 길하고 허물이 없다. 왕이 세 번 명을 내린다.", "meaning": "현장을 아는 책임자가 신뢰를 바탕으로 이끌어야 합니다."}, {"zh": "六三：師或輿尸，凶。", "ko": "군대가 혹 시신을 수레에 싣고 돌아오니 흉하다.", "meaning": "무능한 지휘와 무리한 추진이 큰 손실로 이어질 수 있습니다."}, {"zh": "六四：師左次，无咎。", "ko": "군대가 물러나 주둔하니 허물이 없다.", "meaning": "후퇴와 재정비도 책임 있는 선택입니다."}, {"zh": "六五：田有禽，利執言，无咎。長子帥師，弟子輿尸，貞凶。", "ko": "밭에 짐승이 있으니 잡아야 한다고 말할 명분이 있고 허물이 없다. 장자가 군대를 이끌어야 하며 미숙한 자가 맡으면 시신을 싣게 되어 바르게 하려 해도 흉하다.", "meaning": "문제에 대응할 명분이 있어도 경험 있는 적임자에게 맡기십시오."}, {"zh": "上六：大君有命，開國承家，小人勿用。", "ko": "큰 임금이 명하여 나라를 열고 집안을 잇게 한다. 소인은 쓰지 말라.", "meaning": "성과를 나눌 때 능력뿐 아니라 인품과 책임감을 살피십시오."}], "meaning": "여러 사람의 힘을 모으는 일에는 명분과 규율, 책임 있는 지휘가 필요합니다. 규모보다 사람을 다치게 하지 않을 운영과 적임자의 선택을 우선하십시오.", "source": "https://zh.wikisource.org/wiki/周易/師"}, {"id": 8, "name": "수지비", "hanja": "比", "theme": "신뢰로 함께함", "judgment": {"zh": "比：吉。原筮元永貞，无咎。不寧方來，後夫凶。", "ko": "비는 길하다. 근본을 살펴 점쳐서 크게 한결같이 바르면 허물이 없다. 편안하지 못한 이들이 막 찾아오니, 뒤늦은 사람은 흉하다."}, "lines": [{"zh": "初六：有孚，比之，无咎。有孚盈缶，終來有它，吉。", "ko": "진실함으로 친하면 허물이 없다. 진실함이 질그릇에 가득하면 끝내 뜻밖의 도움도 와서 길하다.", "meaning": "꾸밈없는 성실함으로 관계의 첫 단추를 끼우십시오."}, {"zh": "六二：比之自內，貞吉。", "ko": "안에서 우러나 친하니 바르게 지키면 길하다.", "meaning": "억지 친분보다 스스로 납득하는 신뢰를 따르십시오."}, {"zh": "六三：比之匪人。", "ko": "친하려는 사람이 마땅한 사람이 아니다.", "meaning": "누구와 가까워지고 있는지 다시 살피십시오."}, {"zh": "六四：外比之，貞吉。", "ko": "밖의 사람과 친하니 바르게 지키면 길하다.", "meaning": "자기 울타리를 넘어 바른 협력자를 찾으십시오."}, {"zh": "九五：顯比。王用三敺，失前禽，邑人不誡，吉。", "ko": "드러내어 공정하게 친한다. 왕이 세 면에서 몰이하되 앞으로 달아나는 짐승은 놓아주고 고을 사람들을 경계시키지 않으니 길하다.", "meaning": "강제로 붙잡기보다 자유로운 참여와 공정함으로 사람을 모으십시오."}, {"zh": "上六：比之无首，凶。", "ko": "친함에 머리와 시작이 없으니 흉하다.", "meaning": "관계의 중심과 목적이 사라졌다면 연결 방식을 재정비하십시오."}], "meaning": "함께할 사람과 중심을 정하고 진실한 관계를 맺는 때입니다. 소속 자체보다 서로 믿을 만한지 살피고 참여할 때를 놓치지 마십시오.", "source": "https://zh.wikisource.org/wiki/周易/比"}, {"id": 9, "name": "풍천소축", "hanja": "小畜", "theme": "작게 쌓고 조절함", "judgment": {"zh": "小畜：亨。密雲不雨，自我西郊。", "ko": "소축은 형통하다. 빽빽한 구름이 우리 서쪽 들에서 일어나지만 아직 비는 내리지 않는다."}, "lines": [{"zh": "初九：復自道，何其咎，吉。", "ko": "제 길로 돌아오니 무슨 허물이 있겠는가. 길하다.", "meaning": "원래의 바른 방향으로 돌아가는 데 주저하지 마십시오."}, {"zh": "九二：牽復，吉。", "ko": "서로 이끌어 돌아오니 길하다.", "meaning": "믿을 만한 사람과 함께 방향을 바로잡으십시오."}, {"zh": "九三：車說輹，夫妻反目。", "ko": "수레의 연결 부속이 빠지고 부부가 서로 반목한다.", "meaning": "진행을 막는 구조적 문제와 가까운 관계의 긴장을 먼저 풀어야 합니다."}, {"zh": "六四：有孚，血去惕出，无咎。", "ko": "진실함이 있으면 피 흘릴 일이 사라지고 두려움에서 벗어나 허물이 없다.", "meaning": "신뢰를 회복하는 대화가 갈등을 줄일 수 있습니다."}, {"zh": "九五：有孚攣如，富以其鄰。", "ko": "진실함으로 단단히 이어져 이웃과 함께 풍요롭다.", "meaning": "자원과 성과를 함께 나눌수록 기반이 단단해집니다."}, {"zh": "上九：既雨既處，尚德載，婦貞厲，月幾望，君子征凶。", "ko": "이미 비가 내려 자리를 잡으니 덕을 높여 쌓은 결과다. 여자가 고집하여 지키면 위태롭고 달은 보름에 가깝다. 군자가 더 나아가면 흉하다.", "meaning": "충분히 얻었다면 더 밀어붙이지 말고 균형을 지키십시오."}], "meaning": "성과가 바로 드러나지 않아도 작은 준비와 절제가 힘을 쌓는 때입니다. 큰 결과를 재촉하기보다 감당할 수 있는 개선을 지속하십시오.", "source": "https://zh.wikisource.org/wiki/周易/小畜"}, {"id": 10, "name": "천택리", "hanja": "履", "theme": "신중한 걸음", "judgment": {"zh": "履虎尾，不咥人，亨。", "ko": "호랑이 꼬리를 밟아도 사람을 물지 않으니 형통하다."}, "lines": [{"zh": "初九：素履，往无咎。", "ko": "소박하게 걸어가면 나아가도 허물이 없다.", "meaning": "겉치레보다 정직하고 단순한 실행을 택하십시오."}, {"zh": "九二：履道坦坦，幽人貞吉。", "ko": "밟는 길이 평탄하니 조용히 지내는 사람이 바르게 지키면 길하다.", "meaning": "남의 시선을 좇지 않고 자신의 길을 꾸준히 가십시오."}, {"zh": "六三：眇能視，跛能履，履虎尾，咥人，凶。武人為于大君。", "ko": "애꾸눈으로 잘 본다 하고 절뚝이면서 잘 걷는다 하다가 호랑이 꼬리를 밟아 물리니 흉하다. 무인이 큰 임금 노릇을 하려는 것과 같다.", "meaning": "능력을 과신하여 맡을 수 없는 역할을 탐하지 마십시오."}, {"zh": "九四：履虎尾，愬愬終吉。", "ko": "호랑이 꼬리를 밟아 두려워하고 삼가니 끝내 길하다.", "meaning": "위험을 인정하고 세심하게 행동하면 잘 통과할 수 있습니다."}, {"zh": "九五：夬履，貞厲。", "ko": "결단하여 걸어가니 바르게 하더라도 위태롭다.", "meaning": "결단력과 함께 반대 의견을 들을 여지를 남기십시오."}, {"zh": "上九：視履考詳，其旋元吉。", "ko": "지나온 행실을 보고 자세히 살피니, 그 되돌아봄이 크게 길하다.", "meaning": "결과만 보지 말고 과정의 타당성을 돌아보십시오."}], "meaning": "위험한 경계에서도 예의와 분별로 안전하게 나아가는 태도를 말합니다. 자신의 능력과 상대의 입장을 헤아리며 한 걸음씩 확인하십시오.", "source": "https://zh.wikisource.org/wiki/周易/履"}, {"id": 11, "name": "지천태", "hanja": "泰", "theme": "소통과 조화", "judgment": {"zh": "泰：小往大來，吉亨。", "ko": "태는 작은 것이 가고 큰 것이 오니 길하고 형통하다."}, "lines": [{"zh": "初九：拔茅茹以其彙，征吉。", "ko": "띠풀을 뽑으니 뿌리가 같은 무리와 함께 딸려 나온다. 나아가면 길하다.", "meaning": "뜻이 맞는 사람들과 함께 움직이면 힘을 얻습니다."}, {"zh": "九二：包荒。用馮河，不遐遺；朋亡。得尚于中行。", "ko": "거친 것도 포용하고 걸어서 강을 건널 용기를 쓰며 먼 곳도 버리지 않는다. 사사로운 편을 없애면 중도를 행함에 합할 수 있다.", "meaning": "포용력과 결단을 갖추되 편파적인 인맥에 갇히지 마십시오."}, {"zh": "九三：无平不陂，无往不復，艱貞无咎。勿恤其孚，于食有福。", "ko": "평평하기만 하고 기울지 않는 것은 없고 가기만 하고 돌아오지 않는 것은 없다. 어려움 속에 바름을 지키면 허물이 없다. 그 믿음을 근심하지 않으면 먹는 데 복이 있다.", "meaning": "호황도 변한다는 것을 알고 기본을 지키십시오."}, {"zh": "六四：翩翩，不富以其鄰；不戒以孚。", "ko": "가볍게 내려와 부유하지 않아도 이웃과 함께하며, 경계시키지 않아도 서로 믿는다.", "meaning": "지위나 재물보다 자연스러운 신뢰가 협력을 만듭니다."}, {"zh": "六五：帝乙歸妹，以祉，元吉。", "ko": "제을이 누이를 시집보내니 이로써 복을 얻어 크게 길하다.", "meaning": "자신을 낮추고 상호 존중하는 결합을 이루십시오."}, {"zh": "上六：城復于隍，勿用師，自邑告命，貞吝。", "ko": "성이 무너져 해자로 돌아간다. 군대를 쓰지 말고 자기 고을에서 명을 전하라. 고집하여 지키면 곤란하다.", "meaning": "기반이 흔들릴 때 외부 확장보다 내부 정비를 우선하십시오."}], "meaning": "하늘과 땅이 서로 통하듯 사람과 조건이 어울리는 때입니다. 순조로울수록 협력을 넓히고 이후의 변화에도 대비하십시오.", "source": "https://zh.wikisource.org/wiki/周易/泰"}, {"id": 12, "name": "천지비", "hanja": "否", "theme": "막힘 속의 원칙", "judgment": {"zh": "否之匪人，不利君子貞，大往小來。", "ko": "막힌 세상이 사람의 바른 도리에 어긋나니 군자가 바름을 펴기에 이롭지 않다. 큰 것이 가고 작은 것이 온다."}, "lines": [{"zh": "初六：拔茅茹以其彙，貞吉。亨。", "ko": "띠풀을 뽑으면 같은 무리의 뿌리가 함께 딸려 나온다. 바르게 지키면 길하고 형통하다.", "meaning": "바른 사람들과 연결되어 기준을 함께 지키십시오."}, {"zh": "六二：包承，小人吉，大人否。亨。", "ko": "감싸 받들면 소인에게는 길하다. 대인은 막힘을 감수하므로 형통하다.", "meaning": "당장의 순응이 원칙을 해치는지 살피십시오."}, {"zh": "六三：包羞。", "ko": "부끄러움을 품고 있다.", "meaning": "감추고 있는 잘못을 인정하고 바로잡으십시오."}, {"zh": "九四：有命，无咎，疇離祉。", "ko": "명을 받으면 허물이 없고 뜻을 함께하는 이들이 복을 누린다.", "meaning": "정당한 책임과 근거를 갖춘 변화는 동료에게도 도움이 됩니다."}, {"zh": "九五：休否，大人吉。其亡其亡，繫于苞桑。", "ko": "막힘을 그치게 하니 대인에게 길하다. 망할까, 망할까 경계하며 뿌리 깊은 뽕나무에 매어 둔다.", "meaning": "회복기에 방심하지 말고 안정 장치를 갖추십시오."}, {"zh": "上九：傾否，先否後喜。", "ko": "막힘이 기울어 무너지니 처음은 막혀도 나중에는 기쁨이 있다.", "meaning": "오래된 장애를 해소할 기회에 필요한 정리를 실행하십시오."}], "meaning": "뜻과 관계가 서로 통하지 않는 시기를 가리킵니다. 억지로 인정받으려 하기보다 원칙과 역량을 지키면서 작은 회복의 길을 찾으십시오.", "source": "https://zh.wikisource.org/wiki/周易/否"}, {"id": 13, "name": "천화동인", "hanja": "同人", "theme": "열린 연대", "judgment": {"zh": "同人于野，亨。利涉大川，利君子貞。", "ko": "들에서 사람들과 함께하면 형통하다. 큰 강을 건너는 것이 이롭고 군자의 바름을 지킴이 이롭다."}, "lines": [{"zh": "初九：同人于門，無咎。", "ko": "문밖에서 사람들과 함께하니 허물이 없다.", "meaning": "열린 만남에서 협력의 첫걸음을 시작하십시오."}, {"zh": "六二：同人于宗，吝。", "ko": "자기 집안 사람들과만 함께하니 곤란하다.", "meaning": "친한 사람만 챙기는 좁은 연대는 한계를 만듭니다."}, {"zh": "九三：伏戎于莽，升其高陵，三歲不興。", "ko": "군사를 수풀에 숨기고 높은 언덕에 오르지만 삼 년 동안 일어나지 못한다.", "meaning": "경쟁자를 의심하며 힘을 숨기는 태도는 일을 오래 막을 수 있습니다."}, {"zh": "九四：乘其墉，弗克攻，吉。", "ko": "성벽에 올랐으나 공격하지 못하니 길하다.", "meaning": "명분 없는 공격을 멈추는 것이 오히려 바른 결단입니다."}, {"zh": "九五：同人，先號啕而後笑。大師克相遇。", "ko": "사람들과 함께하려 하여 먼저 크게 울지만 뒤에는 웃는다. 큰 군대가 이겨 서로 만난다.", "meaning": "진실한 연대는 장애를 넘는 노력 뒤에 이루어질 수 있습니다."}, {"zh": "上九：同人于郊，無悔。", "ko": "들 바깥에서 사람들과 함께하니 후회가 없다.", "meaning": "완벽한 일치를 강요하지 말고 가능한 범위의 만남을 받아들이십시오."}], "meaning": "좁은 이해관계를 넘어 공통의 목적을 찾는 괘입니다. 끼리끼리의 결속보다 누구에게나 설명할 수 있는 기준으로 협력하십시오.", "source": "https://zh.wikisource.org/wiki/周易/同人"}, {"id": 14, "name": "화천대유", "hanja": "大有", "theme": "풍요의 책임", "judgment": {"zh": "大有：元亨。", "ko": "대유는 크게 형통하다."}, "lines": [{"zh": "初九：无交害，匪咎，艱則无咎。", "ko": "해로운 것과 사귀지 않으면 허물이 아니다. 어려움을 생각하며 조심하면 허물이 없다.", "meaning": "성과가 생기기 시작할 때부터 위험한 관계를 경계하십시오."}, {"zh": "九二：大車以載，有攸往，无咎。", "ko": "큰 수레에 실어 갈 곳이 있으니 허물이 없다.", "meaning": "자원을 감당할 체계가 갖추어졌다면 목적에 맞게 활용하십시오."}, {"zh": "九三：公用亨于天子，小人弗克。", "ko": "공이 천자에게 바치고 향응하니 소인은 이를 감당하지 못한다.", "meaning": "큰 성과를 공적인 목적에 나눌 그릇이 필요합니다."}, {"zh": "九四：匪其彭，无咎。", "ko": "자신의 성대함을 내세우지 않으면 허물이 없다.", "meaning": "자신의 부와 능력을 과장하거나 과시하지 마십시오."}, {"zh": "六五：厥孚交如，威如；吉。", "ko": "그 진실함이 서로 통하고 위엄이 있으니 길하다.", "meaning": "친밀한 신뢰와 분명한 원칙을 함께 유지하십시오."}, {"zh": "上九：自天佑之，吉无不利。", "ko": "하늘이 도우니 길하고 이롭지 않음이 없다.", "meaning": "도움을 당연하게 여기지 말고 감사와 책임으로 응답하십시오."}], "meaning": "많이 가진 상태에서는 그 힘을 어떻게 쓰는지가 중요합니다. 능력과 자원을 과시하기보다 널리 도움이 되도록 쓰고 겸손을 유지하십시오.", "source": "https://zh.wikisource.org/wiki/周易/大有"}, {"id": 15, "name": "지산겸", "hanja": "謙", "theme": "겸손과 균형", "judgment": {"zh": "謙：亨，君子有終。", "ko": "겸은 형통하니 군자는 끝맺음이 있다."}, "lines": [{"zh": "初六：謙謙君子，用涉大川，吉。", "ko": "겸손하고 또 겸손한 군자는 큰 강을 건너도 길하다.", "meaning": "자기 한계를 알고 배움을 구하는 태도가 도전을 돕습니다."}, {"zh": "六二：鳴謙，貞吉。", "ko": "겸손함이 밖으로 드러나니 바르게 지키면 길하다.", "meaning": "말과 행동에 일관되게 배어 있는 겸손을 지키십시오."}, {"zh": "九三：勞謙君子，有終吉。", "ko": "공로가 있어도 겸손한 군자는 끝맺음이 있어 길하다.", "meaning": "수고와 실적을 자랑하기보다 끝까지 책임지십시오."}, {"zh": "六四：无不利，撝謙。", "ko": "이롭지 않음이 없으니 겸손을 펼친다.", "meaning": "일상의 판단과 행동에 겸손을 실천하십시오."}, {"zh": "六五：不富，以其鄰，利用侵伐，无不利。", "ko": "부유함에 기대지 않고 이웃과 함께한다. 잘못을 치는 것이 이로워 이롭지 않음이 없다.", "meaning": "겸손하되 공동의 원칙을 훼손하는 문제에는 단호히 대응하십시오."}, {"zh": "上六：鳴謙，利用行師，征邑國。", "ko": "겸손함이 드러나니 군대를 움직여 자기 고을과 나라를 바로잡는 것이 이롭다.", "meaning": "남을 탓하기 전에 자신이 책임지는 영역부터 바로잡으십시오."}], "meaning": "높은 산이 땅 아래 있는 모습처럼 실력이 있어도 자신을 낮추는 괘입니다. 공을 독점하지 않고 지나친 곳을 덜어 부족한 곳을 채우십시오.", "source": "https://zh.wikisource.org/wiki/周易/謙"}, {"id": 16, "name": "뇌지예", "hanja": "豫", "theme": "즐거움과 준비", "judgment": {"zh": "豫：利建侯行師。", "ko": "예는 지도자를 세우고 군대를 움직이는 것이 이롭다."}, "lines": [{"zh": "初六：鳴豫，凶。", "ko": "즐거움을 떠들어 드러내니 흉하다.", "meaning": "작은 성과에 들떠 과시하는 태도를 경계하십시오."}, {"zh": "六二：介于石，不終日，貞吉。", "ko": "돌처럼 굳게 지키며 하루가 끝나기 전에 기미를 알아차리니 바르게 지켜 길하다.", "meaning": "분위기에 휩쓸리지 말고 변화의 징후에 신속히 대응하십시오."}, {"zh": "六三：盱豫，悔。遲有悔。", "ko": "위를 쳐다보며 즐거움을 바라니 후회한다. 늦어져도 후회가 있다.", "meaning": "남의 반응만 기다리지 말고 스스로 옳은 때를 판단하십시오."}, {"zh": "九四：由豫，大有得。勿疑。朋盍簪。", "ko": "즐거움이 여기에서 비롯되니 크게 얻는다. 의심하지 말라. 벗들이 모인다.", "meaning": "사람들이 자발적으로 참여할 수 있는 공통의 목적을 제시하십시오."}, {"zh": "六五：貞疾，恆不死。", "ko": "고질적인 병이 있으나 오래도록 죽지 않는다.", "meaning": "풀리지 않는 제약을 인정하면서도 유지할 수 있는 힘을 돌보십시오."}, {"zh": "上六：冥豫，成有渝，无咎。", "ko": "즐거움에 어두워졌으나 이미 그렇게 되었더라도 바뀌면 허물이 없다.", "meaning": "즐거움에 빠져 판단을 놓쳤다면 지금이라도 태도를 바꾸십시오."}], "meaning": "사람들의 마음과 기세가 모여 움직임을 준비하는 때입니다. 즐거움과 기대를 실행의 힘으로 바꾸되 들뜬 분위기에 판단을 맡기지 마십시오.", "source": "https://zh.wikisource.org/wiki/周易/豫"}, {"id": 17, "name": "택뢰수", "hanja": "隨", "theme": "때에 맞게 따름", "judgment": {"zh": "隨：元亨。利貞。无咎。", "ko": "수는 크게 형통하다. 바름을 지키는 것이 이롭고 허물이 없다."}, "lines": [{"zh": "初九：官有渝，貞吉。出門交有功。", "ko": "맡은 일에 변화가 있으니 바르게 지키면 길하다. 문을 나서서 사귀면 공이 있다.", "meaning": "익숙한 역할이 바뀔 수 있습니다. 열린 교류 속에서도 판단 기준을 지키세요."}, {"zh": "六二：係小子，失丈夫。", "ko": "어린아이에게 매이면 장부를 잃는다.", "meaning": "당장의 편안함에 매여 더 성숙한 관계나 기회를 놓치지 않는지 살펴보세요."}, {"zh": "六三：係丈夫，失小子。隨，有求得利，居貞。", "ko": "장부에게 매이면 어린아이를 잃는다. 따름에 구하는 바를 얻으니, 바름에 머무는 것이 이롭다.", "meaning": "중요한 방향을 택하려면 덜 중요한 것을 놓아야 합니다. 선택한 뒤에도 원칙을 지키세요."}, {"zh": "九四：隨有獲，貞凶。有孚在道，以明，何咎。", "ko": "따라서 얻는 것이 있으나 고집하면 흉하다. 믿음이 있고 도리에 맞으며 밝게 행한다면 무슨 허물이 있겠는가.", "meaning": "성과를 붙드는 욕심이 신뢰를 해칠 수 있습니다. 얻은 것의 과정과 목적을 투명하게 하세요."}, {"zh": "九五：孚于嘉，吉。", "ko": "아름답고 선한 것에 믿음을 두니 길하다.", "meaning": "좋은 가치와 사람에 대한 신뢰를 행동으로 보여줄 때입니다."}, {"zh": "上六：拘係之，乃從維之。王用亨于西山。", "ko": "붙잡아 매고, 이어 묶어 둔다. 왕이 서산에서 제사를 드린다.", "meaning": "오래 이어진 결속과 헌신을 살피세요. 관계의 의미를 확인하되 강요로 바꾸지는 마세요."}], "meaning": "흐름을 읽고 믿을 만한 사람과 뜻을 함께하는 때입니다. 무엇을 얻는가보다 무엇을 따르는가를 먼저 살펴보세요.", "source": "https://zh.wikisource.org/wiki/周易/隨"}, {"id": 18, "name": "산풍고", "hanja": "蠱", "theme": "묵은 폐단을 바로잡음", "judgment": {"zh": "蠱：元亨。利涉大川。先甲三日，後甲三日。", "ko": "고는 크게 형통하다. 큰 내를 건너는 것이 이롭다. 갑일에 앞서 사흘, 갑일 뒤에도 사흘을 살핀다."}, "lines": [{"zh": "初六：幹父之蠱，有子考，无咎，厲終吉。", "ko": "아버지의 잘못된 일을 바로잡는다. 아들이 있으니 돌아가신 아버지에게 허물이 없다. 위태로우나 끝내 길하다.", "meaning": "물려받은 문제를 책임 있게 수습하세요. 과거를 존중하는 일과 잘못을 고치는 일은 함께할 수 있습니다."}, {"zh": "九二：幹母之蠱，不可貞。", "ko": "어머니의 잘못된 일을 바로잡되, 굳세게 고집해서는 안 된다.", "meaning": "가까운 관계의 문제일수록 일방적으로 밀어붙이지 말고 부드럽게 조정하세요."}, {"zh": "九三：幹父之蠱，小有悔，无大咎。", "ko": "아버지의 잘못된 일을 바로잡는다. 작은 후회는 있으나 큰 허물은 없다.", "meaning": "개선 과정의 작은 마찰 때문에 필요한 수정을 포기하지 마세요."}, {"zh": "六四：裕父之蠱，往見吝。", "ko": "아버지의 잘못된 일을 너그럽게 내버려 두니, 나아가면 부끄러움을 만난다.", "meaning": "문제를 덮어두는 관대함은 해결이 아닙니다. 미룬 일을 구체적으로 정리하세요."}, {"zh": "六五：幹父之蠱，用譽。", "ko": "아버지의 잘못된 일을 바로잡아 명예를 얻는다.", "meaning": "존중과 실력을 갖춘 개선이 신뢰를 회복하게 합니다."}, {"zh": "上九：不事王侯，高尚其事。", "ko": "왕후를 섬기지 않고 자신의 일을 높고 고상하게 한다.", "meaning": "외부의 지위보다 지켜야 할 가치가 무엇인지 정하세요. 참여하지 않는 선택도 숙고할 수 있습니다."}], "meaning": "방치된 문제를 고쳐 새 질서를 세우는 때입니다. 잘못된 사람을 찾는 데 머물지 말고 원인과 재발 방지까지 살펴보세요.", "source": "https://zh.wikisource.org/wiki/周易/蠱"}, {"id": 19, "name": "지택림", "hanja": "臨", "theme": "다가가 돌봄", "judgment": {"zh": "臨：元亨。利貞。至于八月有凶。", "ko": "림은 크게 형통하다. 바름을 지키는 것이 이롭다. 여덟째 달에 이르면 흉함이 있다."}, "lines": [{"zh": "初九：咸臨，貞吉。", "ko": "함께 감응하여 다가가니, 바르게 지키면 길하다.", "meaning": "상대를 움직이려 하기 전에 뜻이 통하는 기반부터 만드세요."}, {"zh": "九二：咸臨，吉无不利。", "ko": "함께 감응하여 다가가니 길하고 이롭지 않은 것이 없다.", "meaning": "호응하는 관계를 활용하되 상대의 의사를 계속 확인하세요."}, {"zh": "六三：甘臨，无攸利。既憂之，无咎。", "ko": "달콤한 말로 다가가니 이로운 바가 없다. 이미 이를 걱정하고 고치면 허물이 없다.", "meaning": "좋게 보이려는 말보다 실질적인 도움을 주세요. 태도를 알아차리면 고칠 수 있습니다."}, {"zh": "六四：至臨，无咎。", "ko": "지극하게 다가가니 허물이 없다.", "meaning": "형식적인 관심을 넘어서 필요한 자리에 직접 다가가세요."}, {"zh": "六五：知臨，大君之宜，吉。", "ko": "지혜로 다가가니 큰 임금에게 마땅한 일이며 길하다.", "meaning": "모든 것을 직접 통제하기보다 적임자를 믿고 큰 방향을 잡으세요."}, {"zh": "上六：敦臨，吉无咎。", "ko": "두터운 마음으로 다가가니 길하고 허물이 없다.", "meaning": "관심을 일회성으로 끝내지 말고 꾸준한 배려로 이어가세요."}], "meaning": "성장하는 힘을 바탕으로 사람과 일에 가까이 다가가는 때입니다. 유리한 흐름에도 끝이 있음을 알고 넉넉함과 준비를 함께 갖추세요.", "source": "https://zh.wikisource.org/wiki/周易/臨"}, {"id": 20, "name": "풍지관", "hanja": "觀", "theme": "깊이 살펴봄", "judgment": {"zh": "觀：盥而不薦，有孚顒若。", "ko": "손을 씻어 정결히 하였으나 아직 제물을 올리기 전이다. 믿음이 있어 우러러보는 모습이다."}, "lines": [{"zh": "初六：童觀，小人无咎，君子吝。", "ko": "어린아이처럼 바라본다. 소인에게는 허물이 없으나 군자에게는 부끄럽다.", "meaning": "첫인상만으로 판단하고 있지 않은지 확인하세요. 책임이 클수록 더 넓게 보아야 합니다."}, {"zh": "六二：窺觀，利女貞。", "ko": "틈으로 엿보듯 바라보니, 여자의 바름을 지키는 것이 이롭다.", "meaning": "제한된 시야를 전체로 여기지 마세요. 여기의 여성상은 고대 역할관을 반영하며, 현대적으로는 관찰 범위를 점검하게 합니다."}, {"zh": "六三：觀我生，進退。", "ko": "나의 삶을 살펴 나아가고 물러난다.", "meaning": "성과와 역량을 돌아본 뒤 진퇴를 결정하세요."}, {"zh": "六四：觀國之光，利用賓于王。", "ko": "나라의 빛나는 모습을 보니 왕의 손님이 되는 것이 이롭다.", "meaning": "좋은 제도와 사람을 가까이에서 배우고 자신의 역할을 찾아보세요."}, {"zh": "九五：觀我生，君子无咎。", "ko": "나의 삶을 살피니 군자는 허물이 없다.", "meaning": "자신의 행동이 주변에 미친 영향을 점검하면 판단의 질이 좋아집니다."}, {"zh": "上九：觀其生，君子无咎。", "ko": "그 삶을 살피니 군자는 허물이 없다.", "meaning": "개인적 득실을 넘어 삶 전체의 태도와 영향을 성찰하세요."}], "meaning": "성급히 개입하기보다 자신과 상황을 한 걸음 떨어져 바라볼 때입니다. 내가 보는 모습과 다른 사람에게 보이는 모습까지 함께 살펴보세요.", "source": "https://zh.wikisource.org/wiki/周易/觀"}, {"id": 21, "name": "화뢰서합", "hanja": "噬嗑", "theme": "막힌 것을 씹어 해결함", "judgment": {"zh": "噬嗑：亨。利用獄。", "ko": "서합은 형통하다. 송사를 다스리는 것이 이롭다."}, "lines": [{"zh": "初九：屨校滅趾，无咎。", "ko": "발에 차꼬를 채워 발가락이 가려지니 허물이 없다.", "meaning": "작은 잘못을 초기에 알아차리고 가벼운 제동으로 바로잡으세요."}, {"zh": "六二：噬膚滅鼻，无咎。", "ko": "부드러운 살을 씹다가 코가 잠기니 허물이 없다.", "meaning": "처리가 쉬워 보여도 지나치게 깊이 개입하지 않는지 점검하세요."}, {"zh": "六三：噬臘肉，遇毒；小吝，无咎。", "ko": "말린 고기를 씹다가 독을 만난다. 조금 부끄러우나 허물은 없다.", "meaning": "문제를 해결하는 과정에서 반발이나 숨은 어려움이 드러날 수 있습니다. 원칙에 맞게 대응하세요."}, {"zh": "九四：噬乾胏，得金矢，利艱貞，吉。", "ko": "뼈 붙은 마른 고기를 씹다가 쇠 화살을 얻는다. 어려움을 알고 바르게 지키는 것이 이로우니 길하다.", "meaning": "단단한 장애를 다룰 때 증거와 끈기가 필요합니다. 어렵다는 사실을 인정하고 한 단계씩 해결하세요."}, {"zh": "六五：噬乾肉，得黃金，貞厲，无咎。", "ko": "마른 고기를 씹다가 황금을 얻는다. 바르게 지켜도 위태로우나 허물은 없다.", "meaning": "판단 권한이 생길수록 공정성과 신중함을 지키세요."}, {"zh": "上九：何校滅耳，凶。", "ko": "목에 큰 칼을 메어 귀가 가려지니 흉하다.", "meaning": "경고를 계속 외면하면 대응할 여지가 줄어듭니다. 지금 들을 수 있는 조언을 놓치지 마세요."}], "meaning": "관계나 일의 흐름을 막는 장애를 분명히 다룰 때입니다. 감정적인 응징보다 사실 확인과 일관된 기준이 중요합니다.", "source": "https://zh.wikisource.org/wiki/周易/噬嗑", "textNote": "원문은 위키문헌 전사본을 대조하였으며, 일부 이체자·이문과 구두점은 통행 독법으로 정리했습니다."}, {"id": 22, "name": "산화비", "hanja": "賁", "theme": "꾸밈과 바탕", "judgment": {"zh": "賁：亨。小利有攸往。", "ko": "비는 형통하다. 나아갈 바가 있는 데 작은 이로움이 있다."}, "lines": [{"zh": "初九：賁其趾，舍車而徒。", "ko": "발을 꾸미고 수레를 버려 걸어간다.", "meaning": "남에게 보이는 편리함보다 자신의 기준에 맞는 소박한 선택을 해보세요."}, {"zh": "六二：賁其須。", "ko": "수염을 꾸민다.", "meaning": "부분의 장식이 전체의 내용과 조화를 이루는지 확인하세요."}, {"zh": "九三：賁如濡如，永貞吉。", "ko": "아름답게 꾸며 윤택하다. 오래 바름을 지키면 길하다.", "meaning": "좋은 평판과 외적 성과 속에서도 기본 태도를 유지하세요."}, {"zh": "六四：賁如皤如，白馬翰如，匪寇婚媾。", "ko": "꾸민 듯하면서 희고 소박하다. 흰 말이 날듯 달린다. 도적이 아니라 혼인하려는 이다.", "meaning": "낯선 접근을 즉시 의심하거나 환영하지 말고 실제 의도를 확인하세요."}, {"zh": "六五：賁於丘園，束帛戔戔，吝，終吉。", "ko": "언덕의 동산을 꾸민다. 비단 묶음이 적어 부끄러우나 끝내 길하다.", "meaning": "규모나 가격보다 정성과 알맞음을 중요하게 여기세요."}, {"zh": "上九：白賁，无咎。", "ko": "희고 소박하게 꾸미니 허물이 없다.", "meaning": "불필요한 장식을 덜어내고 핵심이 드러나게 하세요."}], "meaning": "겉모양과 표현을 다듬되 그 바탕을 잃지 말아야 할 때입니다. 아름답게 보이는 일과 실제로 좋은 일을 구분해 살펴보세요.", "source": "https://zh.wikisource.org/wiki/周易/賁"}, {"id": 23, "name": "산지박", "hanja": "剝", "theme": "무너짐 속에서 지킴", "judgment": {"zh": "剝：不利有攸往。", "ko": "박은 나아갈 바가 있는 것이 이롭지 않다."}, "lines": [{"zh": "初六：剝牀以足，蔑貞凶。", "ko": "평상의 다리부터 깎여 나간다. 바름을 업신여기니 흉하다.", "meaning": "작은 균열처럼 보이는 기본 조건의 약화를 먼저 점검하세요."}, {"zh": "六二：剝牀以辨，蔑貞凶。", "ko": "평상의 테두리까지 깎여 나간다. 바름을 업신여기니 흉하다.", "meaning": "위험이 가까워지고 있다면 기존 보호 장치가 충분한지 다시 살펴보세요."}, {"zh": "六三：剝之，无咎。", "ko": "깎여 나가는 가운데 벗어나니 허물이 없다.", "meaning": "해로운 흐름에서 떨어져 나오는 선택을 생각해 보세요."}, {"zh": "六四：剝牀以膚，凶。", "ko": "평상을 깎아 살갗에까지 이르니 흉하다.", "meaning": "문제가 직접 영향을 주는 단계라면 무리한 전진보다 피해 축소를 우선하세요."}, {"zh": "六五：貫魚，以宮人寵，无不利。", "ko": "물고기를 꿰듯 차례를 이루고, 궁인들처럼 총애를 받으니 이롭지 않은 것이 없다.", "meaning": "흩어진 이해관계를 질서 있게 조정하고 협력의 통로를 만드세요."}, {"zh": "上九：碩果不食，君子得輿，小人剝廬。", "ko": "큰 열매는 먹히지 않는다. 군자는 수레를 얻고 소인은 제 집을 허문다.", "meaning": "어려움 속에서도 남은 자원을 보존하세요. 단기 이익 때문에 스스로의 기반을 허물지 마세요."}], "meaning": "기반이 약해지는 때에는 확장보다 보존을 먼저 생각할 수 있습니다. 모든 것을 붙들기보다 다음 시작에 필요한 핵심을 남기세요.", "source": "https://zh.wikisource.org/wiki/周易/剝", "textNote": "원문은 위키문헌 전사본을 대조하였으며, 일부 이체자·이문과 구두점은 통행 독법으로 정리했습니다."}, {"id": 24, "name": "지뢰복", "hanja": "復", "theme": "돌아옴과 회복", "judgment": {"zh": "復：亨。出入无疾，朋來无咎。反復其道，七日來復，利有攸往。", "ko": "복은 형통하다. 나가고 들어옴에 병이 없고 벗이 와도 허물이 없다. 그 길을 되돌아오니 이레 만에 돌아온다. 나아갈 바가 있는 것이 이롭다."}, "lines": [{"zh": "初九：不遠復，无祇悔，元吉。", "ko": "멀리 가지 않고 돌아오니 후회에 이르지 않는다. 크게 길하다.", "meaning": "작은 어긋남을 일찍 알아차려 바로잡으세요."}, {"zh": "六二：休復，吉。", "ko": "아름답게 돌아오니 길하다.", "meaning": "좋은 본보기를 가까이하고 돌아갈 기준을 분명히 하세요."}, {"zh": "六三：頻復，厲无咎。", "ko": "거듭 돌아오니 위태로우나 허물은 없다.", "meaning": "같은 실수를 반복한다면 의지만 다지지 말고 되풀이되는 조건을 바꾸세요."}, {"zh": "六四：中行獨復。", "ko": "여럿 가운데서 홀로 돌아온다.", "meaning": "주변의 흐름과 달라도 옳다고 판단한 방향으로 돌아설 수 있습니다."}, {"zh": "六五：敦復，无悔。", "ko": "두터운 마음으로 돌아오니 후회가 없다.", "meaning": "회복의 결심을 꾸준한 습관과 책임 있는 행동으로 옮기세요."}, {"zh": "上六：迷復，凶，有災眚。用行師，終有大敗，以其國君，凶；至于十年，不克征。", "ko": "돌아올 길을 잃으니 흉하고 재앙과 잘못이 있다. 군사를 움직이면 끝내 크게 패하고 나라의 임금에게도 흉하다. 십 년에 이르도록 정벌하지 못한다.", "meaning": "방향을 잃은 채 규모를 키우지 마세요. 멈추어 원인을 검토하는 일이 더 큰 손실을 줄입니다."}], "meaning": "작은 회복의 조짐을 알아보고 기본으로 돌아가는 때입니다. 곧바로 큰 성과를 요구하기보다 회복을 지속할 여건을 마련하세요.", "source": "https://zh.wikisource.org/wiki/周易/復"}, {"id": 25, "name": "천뢰무망", "hanja": "無妄", "theme": "꾸밈없는 바름", "judgment": {"zh": "无妄：元亨。利貞。其匪正有眚，不利有攸往。", "ko": "무망은 크게 형통하다. 바름을 지키는 것이 이롭다. 바르지 않으면 재앙이 있으니 나아갈 바가 있는 것이 이롭지 않다."}, "lines": [{"zh": "初九：无妄，往吉。", "ko": "망령됨이 없으니 나아가면 길하다.", "meaning": "꾸미지 않은 동기와 정당한 방법이 갖추어졌는지 확인한 뒤 움직이세요."}, {"zh": "六二：不耕穫，不菑畬，則利有攸往。", "ko": "밭 갈아 수확하는 일도, 새 밭을 일구어 묵힌 밭으로 만드는 일도 억지로 꾀하지 않으면 나아갈 바가 있는 것이 이롭다.", "meaning": "이 구절은 여러 해석이 있습니다. 여기서는 주희 계열의 독법에 따라 결과를 사사로이 기획하고 집착하지 않는 태도로 읽습니다."}, {"zh": "六三：无妄之災，或繫之牛，行人之得，邑人之災。", "ko": "뜻밖의 재앙이다. 누군가 매어 둔 소를 지나가던 사람이 얻으니 마을 사람에게 재앙이 된다.", "meaning": "억울한 영향이나 우연한 손실을 곧바로 도덕적 잘못과 연결하지 마세요. 실제 경위를 확인하세요."}, {"zh": "九四：可貞，无咎。", "ko": "바르게 지킬 수 있으니 허물이 없다.", "meaning": "외부의 변화에 휘둘리기보다 지킬 수 있는 원칙을 유지하세요."}, {"zh": "九五：无妄之疾，勿藥有喜。", "ko": "뜻밖의 병은 약을 쓰지 않아도 기쁨이 있다.", "meaning": "불필요한 개입을 경계하는 비유로 읽을 수 있습니다. 실제 질병의 치료나 복약 여부를 정하는 지침은 아닙니다."}, {"zh": "上九：无妄，行有眚，无攸利。", "ko": "망령됨이 없더라도 움직이면 재앙이 있고 이로운 바가 없다.", "meaning": "의도가 옳아도 시기와 조건이 맞지 않을 수 있습니다. 행동을 늦추는 선택을 검토하세요."}], "meaning": "사사로운 기대나 억지 계산을 줄이고 바른 동기로 행동할 때입니다. 예상하지 못한 일까지 자신이나 타인의 잘못으로 단정하지 마세요.", "source": "https://zh.wikisource.org/wiki/周易/无妄"}, {"id": 26, "name": "산천대축", "hanja": "大畜", "theme": "큰 힘을 길러둠", "judgment": {"zh": "大畜：利貞，不家食吉，利涉大川。", "ko": "대축은 바름을 지키는 것이 이롭다. 집에서만 먹지 않으면 길하고, 큰 내를 건너는 것이 이롭다."}, "lines": [{"zh": "初九：有厲利已。", "ko": "위태로움이 있으니 그치는 것이 이롭다.", "meaning": "초기 경고가 보이면 힘으로 밀어붙이지 말고 잠시 멈추세요."}, {"zh": "九二：輿說輹。", "ko": "수레의 바퀴 고정 장치가 벗겨진다.", "meaning": "지금 움직일 수 없는 이유를 확인하고 필요한 정비를 하세요."}, {"zh": "九三：良馬逐，利艱貞，吉。日閑輿衛，利有攸往。", "ko": "좋은 말들이 달린다. 어려움을 알고 바르게 지키는 것이 이로우니 길하다. 날마다 수레 몰기와 방어를 익히면 나아갈 바가 있는 것이 이롭다.", "meaning": "추진력이 생겼을수록 반복 훈련과 대비를 함께 갖추세요."}, {"zh": "六四：童牛之牿，元吉。", "ko": "어린 소의 뿔에 가로 나무를 대니 크게 길하다.", "meaning": "문제가 커진 뒤 막기보다 초기 환경과 습관을 잘 설계하세요."}, {"zh": "六五：豶豕之牙，吉。", "ko": "거세한 돼지의 어금니이니 길하다.", "meaning": "겉으로 드러난 힘보다 그 힘을 거칠게 만드는 원인을 다루세요."}, {"zh": "上九：何天之衢，亨。", "ko": "하늘의 큰길이 활짝 열리니 형통하다.", "meaning": "쌓아 둔 역량을 넓은 목적에 사용할 수 있는 길을 찾아보세요."}], "meaning": "능력과 자원을 쌓고 강한 추진력을 다스리는 때입니다. 준비가 갖추어지면 개인의 울타리를 넘어 더 큰 일에 쓸 수 있습니다.", "source": "https://zh.wikisource.org/wiki/周易/大畜", "textNote": "원문은 위키문헌 전사본을 대조하였으며, 일부 이체자·이문과 구두점은 통행 독법으로 정리했습니다."}, {"id": 27, "name": "산뢰이", "hanja": "頤", "theme": "기르고 먹여 살림", "judgment": {"zh": "頤：貞吉。觀頤，自求口實。", "ko": "이는 바르게 지키면 길하다. 기르는 바를 살피고 스스로 입에 넣을 것을 구한다."}, "lines": [{"zh": "初九：舍爾靈龜，觀我朵頤，凶。", "ko": "너의 신령한 거북을 버리고 내가 턱을 움직여 먹는 것을 바라보니 흉하다.", "meaning": "자신의 판단과 자원을 버리고 남이 가진 것만 부러워하지 마세요."}, {"zh": "六二：顛頤，拂經，于丘頤，征凶。", "ko": "거꾸로 길러지기를 구해 떳떳한 도리를 어긴다. 언덕 위에서 기름을 구하러 나아가니 흉하다.", "meaning": "도움을 받는 방식이 관계의 책임과 균형을 무너뜨리지 않는지 살펴보세요."}, {"zh": "六三：拂頤，貞凶，十年勿用，无攸利。", "ko": "기르는 도리를 어긴다. 고집하면 흉하니 십 년 동안 쓰지 말아야 하며 이로운 바가 없다.", "meaning": "해로운 습관을 지속하는 것을 꾸준함으로 착각하지 마세요."}, {"zh": "六四：顛頤吉，虎視眈眈，其欲逐逐，无咎。", "ko": "아래에서 기름을 구하니 길하다. 호랑이가 눈을 부릅뜨고 보듯, 그 바람이 끊이지 않으니 허물이 없다.", "meaning": "필요한 도움을 겸손히 구하되 공동의 목적에 집중하세요."}, {"zh": "六五：拂經，居貞吉，不可涉大川。", "ko": "떳떳한 길과 어긋나 있으나 머물러 바름을 지키면 길하다. 큰 내를 건너서는 안 된다.", "meaning": "지원과 자원이 제한된 동안은 큰 도전보다 안정적인 운영을 우선하세요."}, {"zh": "上九：由頤，厲吉，利涉大川。", "ko": "기르는 근원이 되니 위태로움을 알면 길하다. 큰 내를 건너는 것이 이롭다.", "meaning": "여럿을 책임질 힘이 있다면 부담도 함께 인정하고 준비된 도전을 하세요."}], "meaning": "몸과 마음을 무엇으로 기르는지 살펴볼 때입니다. 받아들이는 말과 정보, 내보내는 말, 자신과 타인을 돌보는 방식을 함께 점검하세요.", "source": "https://zh.wikisource.org/wiki/周易/頤"}, {"id": 28, "name": "택풍대과", "hanja": "大過", "theme": "지나친 무게를 감당함", "judgment": {"zh": "大過：棟橈，利有攸往，亨。", "ko": "대과는 마룻대가 휘어진다. 나아갈 바가 있는 것이 이롭고 형통하다."}, "lines": [{"zh": "初六：藉用白茅，无咎。", "ko": "흰 띠풀을 깔아 받치니 허물이 없다.", "meaning": "중요한 일을 시작할 때 바닥을 충분히 받치듯 세심하게 준비하세요."}, {"zh": "九二：枯楊生稊，老夫得其女妻，无不利。", "ko": "마른 버들에서 새싹이 나고 늙은 남편이 젊은 아내를 얻으니 이롭지 않은 것이 없다.", "meaning": "쇠한 상황에도 새로운 결합이나 자원이 회복의 계기가 될 수 있습니다."}, {"zh": "九三：棟橈，凶。", "ko": "마룻대가 휘어지니 흉하다.", "meaning": "한 사람이나 한 지점에 지나친 부담이 쏠렸는지 확인하세요."}, {"zh": "九四：棟隆，吉。有它吝。", "ko": "마룻대가 솟아 받치니 길하다. 다른 뜻이 있으면 부끄럽다.", "meaning": "지탱할 방법을 찾았다면 곁가지 욕심보다 핵심 문제에 집중하세요."}, {"zh": "九五：枯楊生華，老婦得其士夫，无咎无譽。", "ko": "마른 버들에서 꽃이 피고 늙은 아내가 젊은 남편을 얻으니 허물도 칭찬도 없다.", "meaning": "겉으로 화려한 변화가 오래 이어질 기반까지 갖추었는지 살펴보세요."}, {"zh": "上六：過涉滅頂，凶，无咎。", "ko": "지나치게 깊은 물을 건너다가 머리까지 잠기니 흉하다. 그러나 허물은 없다.", "meaning": "뜻이 정당해도 감당할 한계를 넘으면 손실이 생깁니다. 희생을 당연하게 여기지 마세요."}], "meaning": "평소의 구조로 감당하기 어려운 부담이 모이는 때입니다. 버티는 힘만 늘리기보다 무게를 나누고 구조를 바꿀 방법을 찾으세요.", "source": "https://zh.wikisource.org/wiki/周易/大過"}, {"id": 29, "name": "중수감", "hanja": "坎", "theme": "거듭된 험함", "judgment": {"zh": "習坎：有孚，維心亨。行有尚。", "ko": "거듭된 험함이다. 믿음이 있으면 마음이 형통하다. 나아가 행하면 가상함이 있다."}, "lines": [{"zh": "初六：習坎，入于坎窞，凶。", "ko": "험함이 거듭되어 구덩이 속으로 들어가니 흉하다.", "meaning": "반복되는 곤란을 익숙하다는 이유로 방치하지 마세요. 더 깊어지는 원인을 확인하세요."}, {"zh": "九二：坎有險，求小得。", "ko": "구덩이에 위험이 있으니 작은 얻음을 구한다.", "meaning": "큰 성과보다 바로 확보할 수 있는 작은 안정과 도움을 찾으세요."}, {"zh": "六三：來之坎坎，險且枕，入于坎窞，勿用。", "ko": "오나 가나 험하고 위태로워 기대어 쉬어도 구덩이에 들어간다. 쓰지 말아야 한다.", "meaning": "어느 쪽으로도 상황이 낫지 않다면 충동적인 선택을 멈추고 조건을 다시 파악하세요."}, {"zh": "六四：樽酒簋貳，用缶，納約自牖，終无咎。", "ko": "술 한 동이와 두 그릇의 음식을 질그릇에 담아 쓰고, 창으로 간소하게 들이니 끝내 허물이 없다.", "meaning": "어려울 때는 형식과 체면을 줄이고 소박하고 직접적인 소통을 시도하세요."}, {"zh": "九五：坎不盈，祗既平，无咎。", "ko": "구덩이가 넘치지 않고 이미 평평해지는 데 이르니 허물이 없다.", "meaning": "넘치도록 욕심내기보다 위험이 잦아드는 만큼만 차분히 정비하세요."}, {"zh": "上六：係用徽纆，寘于叢棘，三歲不得，凶。", "ko": "밧줄로 묶어 가시덤불 속에 두니 삼 년 동안 풀려나지 못하여 흉하다.", "meaning": "문제를 고착시키는 제약을 분명히 하고 혼자 버티기보다 실제 도움의 통로를 찾으세요."}], "meaning": "어려움이 겹칠수록 중심과 신뢰를 지키며 작은 출구를 찾아야 합니다. 한 번에 벗어나려 무리하기보다 확인 가능한 한 걸음을 이어가세요.", "source": "https://zh.wikisource.org/wiki/周易/坎", "textNote": "원문은 위키문헌 전사본을 대조하였으며, 일부 이체자·이문과 구두점은 통행 독법으로 정리했습니다."}, {"id": 30, "name": "중화리", "hanja": "離", "theme": "밝음과 의지할 바", "judgment": {"zh": "離：利貞。亨。畜牝牛，吉。", "ko": "리는 바름을 지키는 것이 이롭고 형통하다. 암소를 기르면 길하다."}, "lines": [{"zh": "初九：履錯然，敬之无咎。", "ko": "발걸음이 뒤섞여 어지럽다. 공경하고 삼가면 허물이 없다.", "meaning": "시작이 복잡할수록 서두르지 말고 하나씩 순서를 확인하세요."}, {"zh": "六二：黃離，元吉。", "ko": "누런빛으로 밝으니 크게 길하다.", "meaning": "과도하게 드러내기보다 균형 잡힌 분별과 온화함을 유지하세요."}, {"zh": "九三：日昃之離，不鼓缶而歌，則大耋之嗟，凶。", "ko": "해가 기우는 밝음이다. 질장구를 두드리며 노래하지 못하고 늙음을 크게 탄식하니 흉하다.", "meaning": "시간의 흐름을 부정하기보다 지금 가능한 기쁨과 역할을 찾으세요."}, {"zh": "九四：突如其來如，焚如，死如，棄如。", "ko": "갑자기 달려오고, 불타고, 죽고, 버려진다.", "meaning": "급격한 열정과 무리한 추진은 지속되기 어렵습니다. 속도를 줄이고 기반을 확인하세요."}, {"zh": "六五：出涕沱若，戚嗟若，吉。", "ko": "눈물을 줄줄 흘리고 슬퍼 탄식하니 길하다.", "meaning": "위태로움을 진지하게 받아들이는 마음이 더 신중한 대응을 돕습니다."}, {"zh": "上九：王用出征，有嘉折首，獲匪其醜，无咎。", "ko": "왕이 출정하여 훌륭한 공을 세우고 우두머리를 꺾되, 그 무리를 함부로 사로잡지 않으니 허물이 없다.", "meaning": "문제를 바로잡을 때 핵심 책임과 주변 사람을 구별하세요. 무차별적인 비난을 피하세요."}], "meaning": "밝게 분별하되 무엇에 기대고 있는지 살펴보는 때입니다. 강렬함을 유지하려 하기보다 지속할 수 있는 기반과 유연함을 갖추세요.", "source": "https://zh.wikisource.org/wiki/周易/離", "textNote": "원문은 위키문헌 전사본을 대조하였으며, 일부 이체자·이문과 구두점은 통행 독법으로 정리했습니다."}, {"id": 31, "name": "택산함", "hanja": "咸", "theme": "서로 느끼고 응함", "judgment": {"zh": "咸：亨。利貞。取女吉。", "ko": "함은 형통하다. 바름을 지키는 것이 이롭다. 아내를 맞으면 길하다."}, "lines": [{"zh": "初六：咸其拇。", "ko": "엄지발가락에 감응한다.", "meaning": "작은 마음의 움직임을 알아차리되 곧바로 큰 결론을 내리지 마세요."}, {"zh": "六二：咸其腓，凶，居吉。", "ko": "종아리에 감응하니 흉하다. 가만히 머물면 길하다.", "meaning": "상대의 작은 신호에 급히 반응하기보다 마음을 가라앉히세요."}, {"zh": "九三：咸其股，執其隨，往吝。", "ko": "넓적다리에 감응하여 따르는 데 집착하니 나아가면 부끄럽다.", "meaning": "자신의 판단 없이 남을 좇고 있지 않은지 살펴보세요."}, {"zh": "九四：貞吉悔亡，憧憧往來，朋從爾思。", "ko": "바르게 지키면 길하고 후회가 사라진다. 마음이 분주히 오가면 벗들이 네 생각을 따른다.", "meaning": "관계를 계산으로 움직이려 하기보다 진실한 태도를 지키세요."}, {"zh": "九五：咸其脢，无悔。", "ko": "등의 살에 감응하니 후회가 없다.", "meaning": "자극에 휩쓸리지 않는 차분함을 지키되 무관심으로 굳어지지 않게 하세요."}, {"zh": "上六：咸其輔，頰，舌。", "ko": "턱과 뺨과 혀에 감응한다.", "meaning": "말로만 호응하고 있지 않은지 확인하고 이해를 행동으로 보여주세요."}], "meaning": "서로의 마음이 움직이는 때에는 먼저 자신을 비우고 상대를 받아들일 수 있습니다. 순간적인 자극과 깊은 공감을 구별하며 관계를 살펴보세요.", "source": "https://zh.wikisource.org/wiki/周易/咸", "textNote": "원문은 위키문헌 전사본을 대조하였으며, 일부 이체자·이문과 구두점은 통행 독법으로 정리했습니다."}, {"id": 32, "name": "뇌풍항", "hanja": "恆", "theme": "오래 지속함", "judgment": {"zh": "恆：亨，无咎。利貞，利有攸往。", "ko": "항은 형통하고 허물이 없다. 바름을 지키는 것이 이롭고 나아갈 바가 있는 것이 이롭다."}, "lines": [{"zh": "初六：浚恆，貞凶，无攸利。", "ko": "처음부터 깊은 지속을 구하니 고집하면 흉하고 이로운 바가 없다.", "meaning": "막 시작한 관계나 일에 완성된 안정감을 즉시 요구하지 마세요."}, {"zh": "九二：悔亡。", "ko": "후회가 사라진다.", "meaning": "지나침을 줄이고 자신의 자리에서 꾸준히 균형을 지키세요."}, {"zh": "九三：不恆其德，或承之羞，貞吝。", "ko": "그 덕을 한결같이 하지 못하니 혹 수치를 받는다. 고집하면 부끄럽다.", "meaning": "때마다 기준이 달라지는지 점검하고 지킬 약속을 분명히 하세요."}, {"zh": "九四：田无禽。", "ko": "사냥하지만 짐승이 없다.", "meaning": "오래 노력해도 성과가 없다면 지속 자체보다 방향과 장소를 점검하세요."}, {"zh": "六五：恆其德，貞，婦人吉，夫子凶。", "ko": "그 덕을 한결같이 지킨다. 바르게 지키되 부인에게는 길하고 남편에게는 흉하다.", "meaning": "고대 역할관을 반영한 대목입니다. 현대적으로는 따름이 필요한 자리와 스스로 판단할 자리를 구별하는 성찰로 읽습니다."}, {"zh": "上六：振恆，凶。", "ko": "동요를 한결같이 하니 흉하다.", "meaning": "계속 방향을 바꾸는 습관을 멈추고 안정적으로 반복할 작은 실천을 정하세요."}], "meaning": "지속할 가치와 반복할 방식을 세우는 때입니다. 변하지 않는 목표를 위해 방법은 상황에 맞게 조정할 수 있어야 합니다.", "source": "https://zh.wikisource.org/wiki/周易/恒", "textNote": "원문은 위키문헌 전사본을 대조하였으며, 일부 이체자·이문과 구두점은 통행 독법으로 정리했습니다."}, {"id": 33, "name": "천산둔", "hanja": "遯", "theme": "물러남의 지혜", "judgment": {"zh": "遯：亨。小利貞。", "ko": "둔은 형통하다. 작은 일에서 바름을 지키는 것이 이롭다."}, "lines": [{"zh": "初六：遯尾，厲，勿用有攸往。", "ko": "물러나는 대열의 꼬리에 있으니 위태롭다. 나아가는 일을 하지 말라.", "meaning": "물러날 때를 놓쳤다면 충동적으로 움직이지 말고 안전부터 확보한다."}, {"zh": "六二：執之用黃牛之革，莫之勝說。", "ko": "누런 소의 가죽으로 단단히 붙잡으니 아무도 풀어내지 못한다.", "meaning": "지켜야 할 약속과 원칙을 분명히 한다."}, {"zh": "九三：係遯，有疾厲，畜臣妾吉。", "ko": "매여서 물러나니 병들고 위태롭다. 신하와 시첩을 거느리는 일에는 길하다.", "meaning": "얽힌 관계가 퇴로를 막는다. 큰일보다 가까운 살림과 책임을 먼저 정리한다."}, {"zh": "九四：好遯君子吉，小人否。", "ko": "좋아하는 것을 두고 물러나니 군자에게는 길하고 소인에게는 그렇지 않다.", "meaning": "애착이 있어도 원칙에 어긋나면 거리를 둘 수 있어야 한다."}, {"zh": "九五：嘉遯，貞吉。", "ko": "아름답게 물러난다. 바름을 지키면 길하다.", "meaning": "명분과 예의를 갖추어 관계나 일을 마무리한다."}, {"zh": "上九：肥遯，无不利。", "ko": "여유롭게 물러나니 이롭지 않음이 없다.", "meaning": "미련과 부담을 내려놓고 새로운 여지를 확보한다."}], "meaning": "물러남은 때를 살펴 자신의 원칙과 힘을 보존하는 선택이다. 무리한 확장보다 경계를 분명히 하고 다음 기회를 준비한다.", "source": "https://zh.wikisource.org/wiki/周易/遯"}, {"id": 34, "name": "뇌천대장", "hanja": "大壯", "theme": "힘의 절제", "judgment": {"zh": "大壯：利貞。", "ko": "대장은 바름을 지키는 것이 이롭다."}, "lines": [{"zh": "初九：壯于趾，征凶，有孚。", "ko": "발끝에 힘이 있으니 나아가면 흉하다. 이는 틀림없다.", "meaning": "기세만 앞선 출발을 멈추고 준비 정도를 확인한다."}, {"zh": "九二：貞吉。", "ko": "바름을 지키면 길하다.", "meaning": "힘을 과시하지 않고 균형 있게 쓰는 태도가 좋다."}, {"zh": "九三：小人用壯，君子用罔，貞厲。羝羊觸藩，羸其角。", "ko": "소인은 힘을 쓰고 군자는 힘을 믿고 거리낌 없이 나아가기도 하니, 고집하면 위태롭다. 숫양이 울타리를 들이받아 뿔이 걸린다.", "meaning": "옳다는 확신이 있어도 억지로 밀어붙이면 스스로 갇힐 수 있다."}, {"zh": "九四：貞吉悔亡，藩決不羸，壯于大轝之腹。", "ko": "바름을 지키면 길하고 후회가 사라진다. 울타리가 열려 걸리지 않으니 큰 수레의 아랫부분이 튼튼한 것과 같다.", "meaning": "기반을 단단히 하면 장애가 풀린 뒤에도 안정적으로 움직일 수 있다."}, {"zh": "六五：喪羊于易，无悔。", "ko": "평탄한 곳에서 양을 잃으니 후회가 없다.", "meaning": "승부욕이나 고집을 내려놓는 것을 손실로만 보지 않는다."}, {"zh": "上六：羝羊觸藩，不能退，不能遂，无攸利，艱則吉。", "ko": "숫양이 울타리를 들이받아 물러날 수도 나아갈 수도 없다. 이로운 바가 없으나 어려움을 알아 삼가면 길하다.", "meaning": "막혔을 때 힘을 더 주기보다 곤란을 인정하고 접근법을 바꾼다."}], "meaning": "힘이 커질수록 그것을 쓰는 기준이 중요해진다. 자신감은 살리되 상대와 상황을 압도하려는 충동을 절제한다.", "source": "https://zh.wikisource.org/wiki/周易/大壯"}, {"id": 35, "name": "화지진", "hanja": "晉", "theme": "밝아지는 진전", "judgment": {"zh": "晉：康侯用錫馬蕃庶，晝日三接。", "ko": "진은 나라를 편안하게 하는 제후가 많은 말을 하사받고, 하루에 세 번 접견되는 것이다."}, "lines": [{"zh": "初六：晉如，摧如，貞吉。罔孚，裕无咎。", "ko": "나아가려 하나 꺾인다. 바름을 지키면 길하다. 믿음을 얻지 못해도 너그러이 기다리면 허물이 없다.", "meaning": "초기의 거절을 성급하게 만회하려 하지 말고 꾸준히 증명한다."}, {"zh": "六二：晉如，愁如，貞吉。受茲介福，于其王母。", "ko": "나아가려 하나 근심스럽다. 바름을 지키면 길하다. 왕모에게서 이 큰 복을 받는다.", "meaning": "불안 속에서도 성실함을 유지하고 윗사람의 도움을 받아들인다."}, {"zh": "六三：眾允，悔亡。", "ko": "여러 사람이 믿어 주니 후회가 사라진다.", "meaning": "독주보다 주변의 동의와 신뢰를 얻는 과정이 중요하다."}, {"zh": "九四：晉如鼫鼠，貞厲。", "ko": "큰 쥐처럼 나아가니 고집하면 위태롭다.", "meaning": "자리와 이익을 탐내며 눈치만 보는 태도를 경계한다."}, {"zh": "六五：悔亡，矢得勿恤，往吉无不利。", "ko": "후회가 사라진다. 잃고 얻음을 근심하지 말라. 나아가면 길하여 이롭지 않음이 없다.", "meaning": "단기 손익에 매달리지 말고 전체 목적에 맞춰 행동한다."}, {"zh": "上九：晉其角，維用伐邑，厲吉无咎，貞吝。", "ko": "뿔을 앞세워 나아가니 오직 자기 고을을 바로잡는 데 쓴다. 위태로우나 길하고 허물이 없다. 이를 고집하면 부끄러움이 있다.", "meaning": "강한 조치는 내부 문제를 바로잡는 범위에 한정하고 오래 끌지 않는다."}], "meaning": "성과가 드러나고 인정받을 기회가 생기는 모습을 말한다. 지위 자체보다 실질적인 기여와 신뢰를 쌓는 데 집중한다.", "source": "https://zh.wikisource.org/wiki/周易/晉"}, {"id": 36, "name": "지화명이", "hanja": "明夷", "theme": "어둠 속의 밝음", "judgment": {"zh": "明夷：利艱貞。", "ko": "명이는 어려움 속에서도 바름을 지키는 것이 이롭다."}, "lines": [{"zh": "初九：明夷于飛，垂其翼。君子于行，三日不食，有攸往，主人有言。", "ko": "밝음이 상하여 날면서 날개를 늘어뜨린다. 군자가 길을 떠나 사흘 동안 먹지 못한다. 가는 곳에서 주인의 말이 있다.", "meaning": "환경이 맞지 않음을 빨리 알아차리고 당장의 불편을 감수해 거리를 둔다."}, {"zh": "六二：明夷，夷于左股，用拯馬壯，吉。", "ko": "밝음이 상하여 왼쪽 넓적다리를 다친다. 구하는 데 튼튼한 말을 쓰면 길하다.", "meaning": "피해를 축소할 수 있는 도움과 수단을 신속히 찾는다."}, {"zh": "九三：明夷于南狩，得其大首，不可疾貞。", "ko": "남쪽 사냥에서 어둠을 일으키는 큰 우두머리를 얻는다. 바로잡기를 너무 서둘러서는 안 된다.", "meaning": "핵심 원인을 해결하더라도 뒤처리는 단계적으로 한다."}, {"zh": "六四：入于左腹，獲明夷之心，于出門庭。", "ko": "왼쪽 배 속으로 들어가 밝음을 해치는 마음을 알아내고 문과 뜰을 나온다.", "meaning": "문제의 속사정을 알았다면 더 얽히기 전에 적절히 빠져나온다."}, {"zh": "六五：箕子之明夷，利貞。", "ko": "기자가 밝음을 감추었던 것처럼 바름을 지키는 것이 이롭다.", "meaning": "드러내지 않는 절제 속에서도 양심과 판단력을 보존한다."}, {"zh": "上六：不明晦，初登于天，後入于地。", "ko": "밝지 못하고 어둡다. 처음에는 하늘에 올랐으나 나중에는 땅속으로 들어간다.", "meaning": "권한이나 성공에 취해 현실을 보지 못하는 태도를 점검한다."}], "meaning": "자신의 밝음이나 뜻을 드러내기 어려운 때를 상징한다. 겉으로는 신중히 처신하면서도 내면의 기준까지 포기하지 않는다.", "source": "https://zh.wikisource.org/wiki/周易/明夷"}, {"id": 37, "name": "풍화가인", "hanja": "家人", "theme": "가까운 관계의 질서", "judgment": {"zh": "家人：利女貞。", "ko": "가인은 여자가 바름을 지키는 것이 이롭다."}, "lines": [{"zh": "初九：閑有家，悔亡。", "ko": "가정에 규범을 세워 지키면 후회가 사라진다.", "meaning": "문제가 커지기 전에 생활 규칙과 서로의 경계를 합의한다."}, {"zh": "六二：无攸遂，在中饋，貞吉。", "ko": "제멋대로 이루려 하지 않고 안에서 음식을 맡는다. 바름을 지키면 길하다.", "meaning": "눈에 띄지 않는 돌봄과 실무도 공동체를 지탱하는 중요한 역할이다."}, {"zh": "九三：家人嗃嗃，悔厲吉；婦子嘻嘻，終吝。", "ko": "가족을 엄하게 다스리면 후회와 위태로움이 있어도 길하다. 아내와 자식이 실없이 웃으며 흐트러지면 끝내 부끄럽다.", "meaning": "방임을 피하되 규칙이 모욕이나 강압이 되지 않도록 절제한다."}, {"zh": "六四：富家，大吉。", "ko": "집안을 풍요롭게 하니 크게 길하다.", "meaning": "공동의 자원과 살림을 돌보는 실천이 관계를 안정시킨다."}, {"zh": "九五：王假有家，勿恤。吉。", "ko": "왕이 집안에 이르니 근심하지 말라. 길하다.", "meaning": "책임 있는 사람이 신뢰와 모범으로 가까운 관계를 이끈다."}, {"zh": "上九：有孚威如，終吉。", "ko": "진실한 믿음이 있고 위엄이 있으니 끝내 길하다.", "meaning": "말보다 일관된 행동과 공정한 기준으로 존중을 얻는다."}], "meaning": "가정과 가까운 공동체의 역할, 신뢰, 일상적 질서를 다룬다. 옛 성별 역할의 표현을 오늘에는 구성원 모두의 책임과 상호 존중을 돌아보는 뜻으로 읽는다.", "source": "https://zh.wikisource.org/wiki/周易/家人"}, {"id": 38, "name": "화택규", "hanja": "睽", "theme": "다름 속의 접점", "judgment": {"zh": "睽：小事吉。", "ko": "규는 작은 일에 길하다."}, "lines": [{"zh": "初九：悔亡，喪馬勿逐，自復；見惡人无咎。", "ko": "후회가 사라진다. 말을 잃어도 뒤쫓지 말라. 저절로 돌아온다. 꺼리는 사람을 만나도 허물이 없다.", "meaning": "관계를 조급하게 통제하지 말고 불편한 상대와도 대화의 길을 남긴다."}, {"zh": "九二：遇主于巷，无咎。", "ko": "골목에서 주인을 만나니 허물이 없다.", "meaning": "형식적인 절차가 막혔다면 소박한 만남으로 소통을 시작한다."}, {"zh": "六三：見輿曳，其牛𧤊，其人天且劓，无初有終。", "ko": "수레가 끌려 막히고 소가 제지되며 그 사람은 이마와 코를 베이는 형벌을 당하는 모습이다. 시작은 좋지 않으나 끝은 있다.", "meaning": "초기 갈등과 수모만으로 결말을 단정하지 말고 원인을 풀어 간다."}, {"zh": "九四：睽孤，遇元夫，交孚，厲无咎。", "ko": "어긋나 홀로 있으나 훌륭한 사람을 만나 서로 믿는다. 위태로우나 허물이 없다.", "meaning": "고립감을 숨기기보다 진솔하게 협력할 한 사람을 찾는다."}, {"zh": "六五：悔亡，厥宗噬膚，往何咎。", "ko": "후회가 사라진다. 같은 무리와의 장벽을 살점을 씹듯 쉽게 뚫으니 나아감에 무슨 허물이 있겠는가.", "meaning": "가까운 이의 호의를 의심만 하지 말고 먼저 접촉한다."}, {"zh": "上九：睽孤，見豕負涂，載鬼一車，先張之弧，後說之弧，匪寇婚媾，往遇雨則吉。", "ko": "어긋나 홀로 있어 진흙을 뒤집어쓴 돼지와 귀신을 실은 수레를 본다. 먼저 활을 당겼다가 뒤에 푼다. 도적이 아니라 혼인할 상대이니 나아가 비를 만나면 길하다.", "meaning": "두려움이 만든 오해인지 실제 사실인지 확인하고 경계를 조정한다."}], "meaning": "서로의 방향과 입장이 어긋난 상태를 나타낸다. 큰 합의를 강요하기보다 함께할 수 있는 작은 일부터 찾아본다.", "source": "https://zh.wikisource.org/wiki/周易/睽"}, {"id": 39, "name": "수산건", "hanja": "蹇", "theme": "장애 앞의 재정비", "judgment": {"zh": "蹇：利西南，不利東北；利見大人，貞吉。", "ko": "건은 서남쪽이 이롭고 동북쪽은 이롭지 않다. 큰 인물을 만나는 것이 이로우며 바름을 지키면 길하다."}, "lines": [{"zh": "初六：往蹇，來譽。", "ko": "나아가면 어렵고 돌아오면 칭찬을 받는다.", "meaning": "지금의 보류나 후퇴가 현명한 선택인지 살핀다."}, {"zh": "六二：王臣蹇蹇，匪躬之故。", "ko": "왕의 신하가 거듭 어려움을 겪으나 자기 한 몸 때문이 아니다.", "meaning": "공동의 책임을 맡았다면 목적을 분명히 하되 홀로 떠안지 않는다."}, {"zh": "九三：往蹇來反。", "ko": "나아가면 어려우니 돌아온다.", "meaning": "막힌 곳을 억지로 넘기보다 익숙한 기반에서 해법을 찾는다."}, {"zh": "六四：往蹇來連。", "ko": "나아가면 어려우니 돌아와 함께 연결한다.", "meaning": "혼자 해결하지 말고 동료와 자원을 연결한다."}, {"zh": "九五：大蹇朋來。", "ko": "큰 어려움에 벗들이 온다.", "meaning": "평소의 신뢰를 바탕으로 도움을 요청한다."}, {"zh": "上六：往蹇來碩，吉；利見大人。", "ko": "나아가면 어려우나 돌아오면 큰 것을 얻으니 길하다. 큰 인물을 만나는 것이 이롭다.", "meaning": "한 걸음 물러나 경험 있는 사람에게 방향을 묻는다."}], "meaning": "앞의 어려움을 알아차리고 멈출 줄 아는 지혜를 말한다. 억지 전진보다 도움을 구하고 조건을 재정비하는 일을 우선한다.", "source": "https://zh.wikisource.org/wiki/周易/蹇"}, {"id": 40, "name": "뇌수해", "hanja": "解", "theme": "긴장의 해소", "judgment": {"zh": "解：利西南，无所往，其來復吉。有攸往，夙吉。", "ko": "해는 서남쪽이 이롭다. 갈 일이 없으면 돌아와 회복하는 것이 길하다. 갈 일이 있으면 일찍 움직이는 것이 길하다."}, "lines": [{"zh": "初六：无咎。", "ko": "허물이 없다.", "meaning": "문제가 풀린 뒤 불필요하게 일을 더 만들지 않는다."}, {"zh": "九二：田獲三狐，得黃矢，貞吉。", "ko": "사냥에서 여우 셋을 잡고 누런 화살을 얻는다. 바름을 지키면 길하다.", "meaning": "숨은 문제를 가려내고 공정한 기준으로 처리한다."}, {"zh": "六三：負且乘，致寇至，貞吝。", "ko": "짐을 지는 자가 수레까지 타니 도적을 불러들인다. 고집하면 부끄럽다.", "meaning": "역량과 책임에 어울리지 않는 과시를 줄인다."}, {"zh": "九四：解而拇，朋至斯孚。", "ko": "너의 엄지발가락에 얽힌 것을 풀면 벗이 와서 믿는다.", "meaning": "발목을 잡는 습관이나 관계를 정리해 좋은 협력의 여지를 만든다."}, {"zh": "六五：君子惟有解，吉；有孚于小人。", "ko": "군자가 풀어내니 길하다. 소인에게서도 그 진실함의 증거가 드러난다.", "meaning": "분명하고 일관된 정리로 주변의 태도 변화를 확인한다."}, {"zh": "上六：公用射隼，于高墉之上，獲之，无不利。", "ko": "공이 높은 담 위의 매를 쏘아 잡으니 이롭지 않음이 없다.", "meaning": "준비가 갖추어지면 남은 핵심 장애를 정확하게 처리한다."}], "meaning": "묶였던 문제가 풀리고 긴장을 내려놓을 수 있는 국면이다. 해결할 일이 남았다면 빨리 처리하고, 끝났다면 평상으로 돌아간다.", "source": "https://zh.wikisource.org/wiki/周易/解"}, {"id": 41, "name": "산택손", "hanja": "損", "theme": "덜어내는 정성", "judgment": {"zh": "損：有孚，元吉。无咎，可貞，利有攸往。曷之用？二簋可用享。", "ko": "손은 믿음이 있으면 크게 길하다. 허물이 없고 바름을 지킬 수 있으며 나아감이 이롭다. 무엇을 쓰겠는가? 두 그릇으로도 제사를 드릴 수 있다."}, "lines": [{"zh": "初九：祀事遄往，无咎，酌損之。", "ko": "제사의 일을 마치고 서둘러 가면 허물이 없다. 헤아려 덜어낸다.", "meaning": "돕는 일이 있어도 자기 여력을 살펴 적정한 만큼 나눈다."}, {"zh": "九二：利貞，征凶，弗損益之。", "ko": "바름을 지키는 것이 이롭고 나아가면 흉하다. 자신을 덜어내지 않고도 상대를 이롭게 한다.", "meaning": "자신의 원칙과 기반을 무너뜨리는 희생을 피한다."}, {"zh": "六三：三人行，則損一人；一人行，則得其友。", "ko": "세 사람이 가면 한 사람을 덜고, 한 사람이 가면 벗을 얻는다.", "meaning": "관계가 복잡해졌다면 역할과 우선순위를 단순하게 정리한다."}, {"zh": "六四：損其疾，使遄有喜，无咎。", "ko": "그 병폐를 덜어내면 빨리 기쁨이 생겨 허물이 없다.", "meaning": "고쳐야 할 습관을 인정하고 지체 없이 개선한다."}, {"zh": "六五：或益之，十朋之龜弗克違，元吉。", "ko": "누군가 이롭게 해 주니 열 붕 값의 거북점도 어길 수 없다. 크게 길하다.", "meaning": "겸손하게 도움을 받아들이고 받은 자원을 잘 쓴다."}, {"zh": "上九：弗損益之，无咎，貞吉，利有攸往，得臣无家。", "ko": "덜어내지 않고 이롭게 하니 허물이 없다. 바름을 지키면 길하고 나아감이 이롭다. 신하를 얻되 사사로운 집안에 얽매이지 않는다.", "meaning": "한쪽의 희생에 기대지 않는 공동의 이익을 설계한다."}], "meaning": "줄임은 무조건적인 희생보다 지나친 것을 덜어 본질을 살리는 일이다. 외형과 욕심을 줄이되 진실한 정성과 필요한 기반은 지킨다.", "source": "https://zh.wikisource.org/wiki/周易/損"}, {"id": 42, "name": "풍뢰익", "hanja": "益", "theme": "함께 커지는 이익", "judgment": {"zh": "益：利有攸往。利涉大川。", "ko": "익은 나아가는 것이 이롭다. 큰 내를 건너는 것이 이롭다."}, "lines": [{"zh": "初九：利用為大作，元吉，无咎。", "ko": "큰일을 벌이는 데 쓰는 것이 이롭다. 크게 길하고 허물이 없다.", "meaning": "기회와 지원을 받았다면 준비된 중요한 일에 집중한다."}, {"zh": "六二：或益之，十朋之龜弗克違，永貞吉。王用享于帝，吉。", "ko": "누군가 이롭게 해 주니 열 붕 값의 거북점도 어길 수 없다. 오래 바름을 지키면 길하다. 왕이 상제에게 제사를 드리면 길하다.", "meaning": "뜻밖의 도움을 자만의 근거로 삼지 말고 성실함을 이어 간다."}, {"zh": "六三：益之用凶事，无咎。有孚中行，告公用圭。", "ko": "흉한 일을 구제하는 데 보탬을 쓰면 허물이 없다. 믿음으로 중도를 행하고 규를 써서 공에게 알린다.", "meaning": "어려움을 해결하려면 지원을 투명하게 쓰고 책임자와 소통한다."}, {"zh": "六四：中行，告公從。利用為依遷國。", "ko": "중도를 행하여 공에게 알리니 따른다. 의지할 기반을 마련해 나라를 옮기는 데 이롭다.", "meaning": "큰 전환은 이해관계자의 동의와 안정적인 기반을 갖춘 뒤 추진한다."}, {"zh": "九五：有孚惠心，勿問元吉。有孚惠我德。", "ko": "믿음으로 은혜를 베푸는 마음이면 묻지 않아도 크게 길하다. 사람들이 진실로 나의 덕을 은혜롭게 여긴다.", "meaning": "대가를 계산하기보다 실제로 도움이 되는 행동을 한다."}, {"zh": "上九：莫益之，或擊之，立心勿恆，凶。", "ko": "아무도 이롭게 해 주지 않고 누군가 치기도 한다. 마음을 세움에 한결같음이 없으니 흉하다.", "meaning": "자기 이익만 좇거나 약속을 바꾸어 신뢰를 잃고 있지 않은지 살핀다."}], "meaning": "늘어난 힘과 자원을 필요한 곳에 돌려 함께 성장하는 형상이다. 기회를 행동으로 옮기면서 이익이 누구에게 돌아가는지 살핀다.", "source": "https://zh.wikisource.org/wiki/周易/益"}, {"id": 43, "name": "택천쾌", "hanja": "夬", "theme": "분명한 결단", "judgment": {"zh": "夬：揚于王庭，孚號，有厲，告自邑，不利即戎，利有攸往。", "ko": "쾌는 왕의 뜰에서 드러내어 진실하게 호소하되 위태로움이 있다. 자기 고을부터 알린다. 무력에 나아가는 것은 이롭지 않고 나아갈 바를 두는 것은 이롭다."}, "lines": [{"zh": "初九：壯于前趾，往不勝為咎。", "ko": "앞발가락에 힘이 있다. 나아가 이기지 못하면 허물이 된다.", "meaning": "결단의 기세만으로 행동하기 전에 실행 능력을 확인한다."}, {"zh": "九二：惕號，莫夜有戎，勿恤。", "ko": "경계하여 외친다. 저문 밤에 적이 있어도 근심하지 말라.", "meaning": "위험을 미리 공유하고 대비하면 갑작스러운 상황에도 흔들림이 줄어든다."}, {"zh": "九三：壯于頄，有凶。君子夬夬，獨行遇雨，若濡有慍，无咎。", "ko": "광대뼈에 힘을 드러내니 흉함이 있다. 군자가 굳게 결단하여 홀로 가다가 비를 만나 젖고 원망을 사더라도 허물이 없다.", "meaning": "분노를 얼굴에 드러내기보다 원칙을 지키며 오해를 견딘다."}, {"zh": "九四：臀无膚，其行次且。牽羊悔亡，聞言不信。", "ko": "엉덩이에 살이 없어 걸음이 머뭇거린다. 양을 이끌면 후회가 사라지나 말을 듣고도 믿지 않는다.", "meaning": "완고함으로 조언을 놓치고 있지 않은지 점검한다."}, {"zh": "九五：莧陸夬夬，中行无咎。", "ko": "비름풀을 끊어내듯 단호하게 결단한다. 중도를 행하면 허물이 없다.", "meaning": "가까이 있는 문제도 분명히 정리하되 지나치게 몰아붙이지 않는다."}, {"zh": "上六：无號，終有凶。", "ko": "부르짖을 길이 없으니 끝내 흉함이 있다.", "meaning": "고립되기 전에 문제를 인정하고 소통의 길을 확보한다."}], "meaning": "쌓인 문제를 공개적으로 밝히고 결단할 때의 태도를 다룬다. 정당한 근거와 내부 정비를 갖추고 감정적 충돌은 피한다.", "source": "https://zh.wikisource.org/wiki/周易/夬"}, {"id": 44, "name": "천풍구", "hanja": "姤", "theme": "뜻밖의 만남", "judgment": {"zh": "姤：女壯，勿用取女。", "ko": "구는 여자의 기세가 강하니 그 여자를 아내로 맞아들이지 말라."}, "lines": [{"zh": "初六：系于金柅，貞吉，有攸往，見凶，羸豕，孚，蹢躅。", "ko": "쇠로 된 제동장치에 매어 두면 바름을 지켜 길하다. 나아가면 흉함을 본다. 마른 돼지도 반드시 날뛰려 한다.", "meaning": "작아 보이는 문제라도 커지기 전에 경계를 세운다."}, {"zh": "九二：包有魚，无咎，不利賓。", "ko": "꾸러미에 물고기가 있으니 허물이 없다. 손님에게는 이롭지 않다.", "meaning": "새로운 관계나 자원을 성급히 넓히지 말고 책임 있게 관리한다."}, {"zh": "九三：臀无膚，其行次且，厲，无大咎。", "ko": "엉덩이에 살이 없어 걸음이 머뭇거린다. 위태롭지만 큰 허물은 없다.", "meaning": "움직임이 불편한 때에는 무리한 접근을 삼가는 것이 낫다."}, {"zh": "九四：包无魚，起凶。", "ko": "꾸러미에 물고기가 없으니 흉함이 일어난다.", "meaning": "가까운 사람이나 기본 자원을 소홀히 하여 기반을 잃지 않았는지 살핀다."}, {"zh": "九五：以杞包瓜，含章，有隕自天。", "ko": "기나무로 오이를 감싸고 아름다움을 품으니 하늘로부터 떨어져 오는 것이 있다.", "meaning": "능력을 과시하기보다 보호하고 길러 때를 기다린다."}, {"zh": "上九：姤其角，吝，无咎。", "ko": "뿔로 만나니 부끄럽지만 허물은 없다.", "meaning": "서로 맞지 않는 만남이라면 공격하지 않으면서 거리를 둔다."}], "meaning": "뜻밖에 들어오는 영향과 만남을 신중히 살피라는 괘다. 옛 혼인 비유를 오늘에는 성별 판단보다 강한 유혹이나 불균형한 결합을 점검하는 뜻으로 읽는다.", "source": "https://zh.wikisource.org/wiki/周易/姤"}, {"id": 45, "name": "택지췌", "hanja": "萃", "theme": "뜻을 모으는 중심", "judgment": {"zh": "萃：王假有廟，利見大人，亨。利貞。用大牲吉，利有攸往。", "ko": "췌는 왕이 종묘에 이른다. 큰 인물을 만나는 것이 이롭고 형통하다. 바름을 지키는 것이 이롭다. 큰 희생을 제물로 쓰면 길하고 나아감이 이롭다."}, "lines": [{"zh": "初六：有孚不終，乃亂乃萃，若號一握為笑，勿恤，往无咎。", "ko": "믿음이 있으나 끝까지 잇지 못해 어지러이 모인다. 부르짖더라도 손을 맞잡으면 웃게 되니 근심하지 말라. 나아가면 허물이 없다.", "meaning": "마음이 흔들릴 때 오해를 풀고 진심을 직접 전한다."}, {"zh": "六二：引吉，无咎，孚乃利用禴。", "ko": "이끌려 함께하면 길하고 허물이 없다. 믿음이 있으면 소박한 제사도 이롭다.", "meaning": "화려한 형식보다 진정성 있는 연결을 따른다."}, {"zh": "六三：萃如，嗟如，无攸利，往无咎，小吝。", "ko": "모이려 하나 탄식하니 이로운 바가 없다. 나아가면 허물은 없으나 조금 부끄러움이 있다.", "meaning": "소속되지 못한 서운함을 인정하고 조심스럽게 참여를 시도한다."}, {"zh": "九四：大吉，无咎。", "ko": "크게 길해야 허물이 없다.", "meaning": "사람을 모으는 위치라면 모두에게 이로운 성과를 책임 있게 만든다."}, {"zh": "九五：萃有位，无咎。匪孚，元永貞，悔亡。", "ko": "모임에 합당한 자리가 있으니 허물이 없다. 믿지 않는 이가 있더라도 근본을 지키고 오래 바르면 후회가 사라진다.", "meaning": "직함만으로 신뢰를 요구하지 말고 일관된 태도로 증명한다."}, {"zh": "上六：齎資涕洟，无咎。", "ko": "탄식하며 눈물과 콧물을 흘리니 허물이 없다.", "meaning": "연결을 잃은 슬픔을 숨기기보다 솔직하게 표현하고 도움을 구한다."}], "meaning": "사람과 자원이 한곳에 모이는 상황이다. 모이는 수보다 공동의 목적과 신뢰할 중심을 세우는 일이 중요하다.", "source": "https://zh.wikisource.org/wiki/周易/萃"}, {"id": 46, "name": "지풍승", "hanja": "升", "theme": "차근차근 올라감", "judgment": {"zh": "升：元亨，用見大人，勿恤，南征吉。", "ko": "승은 크게 형통하다. 큰 인물을 만나되 근심하지 말라. 남쪽으로 나아가면 길하다."}, "lines": [{"zh": "初六：允升，大吉。", "ko": "믿음을 얻어 올라가니 크게 길하다.", "meaning": "첫걸음에서 주변의 신뢰와 협력을 얻는다."}, {"zh": "九二：孚乃利用禴，无咎。", "ko": "믿음이 있으면 소박한 제사도 이롭고 허물이 없다.", "meaning": "형식적인 과시보다 진실한 실력을 쌓는다."}, {"zh": "九三：升虛邑。", "ko": "빈 고을로 올라간다.", "meaning": "장애가 적을 때 기회를 활용하되 준비를 소홀히 하지 않는다."}, {"zh": "六四：王用享于岐山，吉无咎。", "ko": "왕이 기산에서 제사를 드리니 길하고 허물이 없다.", "meaning": "성과를 혼자 차지하지 말고 기반과 도움에 감사한다."}, {"zh": "六五：貞吉，升階。", "ko": "바름을 지키면 길하다. 계단을 밟아 올라간다.", "meaning": "단계를 건너뛰지 않고 정당한 절차로 성장한다."}, {"zh": "上六：冥升，利于不息之貞。", "ko": "어둠 속에서도 올라간다. 쉬지 않고 바름을 지키는 것이 이롭다.", "meaning": "상승 욕심에 눈이 멀지 않도록 목적을 점검하며 꾸준함을 지킨다."}], "meaning": "한 단계씩 힘을 쌓아 올라가는 성장을 뜻한다. 조급한 도약보다 배움과 지원을 바탕으로 꾸준한 진전을 만든다.", "source": "https://zh.wikisource.org/wiki/周易/升"}, {"id": 47, "name": "택수곤", "hanja": "困", "theme": "곤궁 속의 중심", "judgment": {"zh": "困：亨，貞大人吉，无咎，有言不信。", "ko": "곤은 형통하다. 바름을 지키는 큰 인물에게 길하고 허물이 없다. 말을 해도 믿어 주지 않는다."}, "lines": [{"zh": "初六：臀困于株木，入于幽谷，三歲不覿。", "ko": "엉덩이가 그루터기에 눌려 곤란하고 깊은 골짜기에 들어가 삼 년 동안 만나지 못한다.", "meaning": "고립과 낙담을 오래 방치하지 말고 바깥의 도움과 연결한다."}, {"zh": "九二：困于酒食，朱紱方來，利用亨祀，征凶，无咎。", "ko": "술과 음식 속에서도 곤궁하나 붉은 인끈을 맨 이가 오려 한다. 제사를 드리는 것이 이롭고 나아가면 흉하지만 허물은 없다.", "meaning": "겉의 풍요와 마음의 막힘을 구분하고 성급한 돌파보다 지원을 기다린다."}, {"zh": "六三：困于石，據于蒺蔾，入于其宮，不見其妻，凶。", "ko": "돌에 막히고 가시덤불에 기대며 자기 집에 들어가도 아내를 보지 못하니 흉하다.", "meaning": "의지할 수 없는 곳에 기대고 있지 않은지 판단하고 기반을 다시 찾는다."}, {"zh": "九四：來荼荼，困于金轝，吝，有終。", "ko": "오는 걸음이 더디고 쇠 수레에 막혀 곤란하다. 부끄러움이 있으나 끝맺음은 있다.", "meaning": "도움이 늦어진다고 단정하지 말고 장애를 구체적으로 조정한다."}, {"zh": "九五：劓刖，困于赤紱，乃徐有說，利用祭祀。", "ko": "코와 발을 베이는 곤란을 겪고 붉은 인끈 때문에 막히나 차츰 풀린다. 제사를 드리는 것이 이롭다.", "meaning": "지위와 의무가 부담이 된 상황에서 성실함으로 회복의 실마리를 찾는다."}, {"zh": "上六：困于葛藟，于臲卼，曰動悔。有悔，征吉。", "ko": "칡덩굴과 불안정한 곳에 얽혀 움직이면 후회한다고 말한다. 잘못을 뉘우치면 나아가 길하다.", "meaning": "실패에 대한 두려움만으로 멈추지 말고 고칠 점을 반영해 움직인다."}], "meaning": "힘과 자원이 막혀 뜻을 펴기 어려운 때를 나타낸다. 말로 인정받으려 애쓰기보다 기본을 지키며 회복할 힘을 보존한다.", "source": "https://zh.wikisource.org/wiki/周易/困"}, {"id": 48, "name": "수풍정", "hanja": "井", "theme": "마르지 않는 기반", "judgment": {"zh": "井：改邑不改井，无喪无得，往來井井。汔至亦未繘井。羸其瓶，凶。", "ko": "정은 고을을 바꾸어도 우물은 바꾸지 않는다. 잃거나 더 얻음 없이 오가는 사람들이 우물을 쓴다. 거의 이르렀어도 아직 물을 길어 올리지 못하거나 물병을 깨뜨리면 흉하다."}, "lines": [{"zh": "初六：井泥不食，舊井无禽。", "ko": "우물이 진흙투성이여서 마시지 못하니 오래된 우물에 짐승도 오지 않는다.", "meaning": "오래 방치한 기반이나 능력을 먼저 정비한다."}, {"zh": "九二：井谷射鮒，瓮敝漏。", "ko": "우물 바닥의 붕어를 쏘며 항아리는 낡아 샌다.", "meaning": "자원이 있어도 전달하는 도구와 방법이 부족하면 쓸 수 없다."}, {"zh": "九三：井渫不食，為我心惻，可用汲，王明，並受其福。", "ko": "우물을 깨끗이 쳤으나 마시지 않으니 내 마음이 슬프다. 물을 길어 쓸 수 있다. 왕이 밝다면 함께 복을 받는다.", "meaning": "준비된 능력을 실제 수요와 연결하고 알아볼 사람에게 알린다."}, {"zh": "六四：井甃，无咎。", "ko": "우물에 벽돌을 쌓아 수리하니 허물이 없다.", "meaning": "당장 성과가 보이지 않아도 유지와 보수는 필요한 일이다."}, {"zh": "九五：井冽，寒泉食。", "ko": "우물이 맑아 차가운 샘물을 마신다.", "meaning": "잘 갖춘 능력과 자원을 실제 도움이 되는 방식으로 제공한다."}, {"zh": "上六：井收勿幕，有孚元吉。", "ko": "우물물을 길어 올리되 덮지 말라. 믿음이 있으면 크게 길하다.", "meaning": "성과를 독점하지 말고 지속적으로 나눌 수 있는 구조를 만든다."}], "meaning": "사람을 오래 길러 주는 기반과 공동의 자원을 뜻한다. 잠재적 가치에 머물지 않고 실제로 누구나 쓸 수 있게 관리하고 마무리한다.", "source": "https://zh.wikisource.org/wiki/周易/井"}, {"id": 49, "name": "택화혁", "hanja": "革", "theme": "때에 맞는 변화", "judgment": {"zh": "革：已日乃孚，元亨。利貞。悔亡。", "ko": "혁은 때가 지난 뒤에야 믿음을 얻는다. 크게 형통하고 바름을 지키는 것이 이로우니 후회가 없어진다."}, "lines": [{"zh": "初九：鞏用黃牛之革。", "ko": "누런 소의 가죽으로 단단히 묶는다.", "meaning": "변화를 서두르기보다 준비와 자기 절제로 기반을 다지십시오."}, {"zh": "六二：已日乃革之，征吉，无咎。", "ko": "때가 지난 뒤에야 바꾸니, 나아가면 길하고 허물이 없다.", "meaning": "준비된 시점을 확인했다면 실행에 옮길 수 있습니다."}, {"zh": "九三：征凶，貞厲，革言三就，有孚。", "ko": "나아가면 흉하고, 바름을 지켜도 위태롭다. 개혁에 관한 논의가 세 번 이루어지면 믿음이 생긴다.", "meaning": "한 번의 주장으로 밀어붙이지 말고 여러 차례 검토와 동의를 거치십시오."}, {"zh": "九四：悔亡，有孚改命，吉。", "ko": "후회가 없어진다. 믿음이 있어 명을 바꾸니 길하다.", "meaning": "신뢰와 정당한 근거가 갖추어진 변화에 힘을 실으십시오."}, {"zh": "九五：大人虎變，未占有孚。", "ko": "대인이 호랑이의 무늬처럼 뚜렷하게 변하니, 점치기 전부터 믿음이 있다.", "meaning": "말보다 분명한 실천으로 변화의 신뢰를 만드십시오."}, {"zh": "上六：君子豹變，小人革面，征凶，居貞吉。", "ko": "군자는 표범의 무늬처럼 변하고 소인은 겉모습을 고친다. 더 나아가면 흉하고, 머물러 바름을 지키면 길하다.", "meaning": "변화를 더 확대하기보다 이미 바꾼 일을 정착시키십시오."}], "meaning": "변화는 필요성만으로 이루어지지 않고 때와 신뢰를 함께 얻어야 합니다. 바꿀 이유를 분명히 설명하고, 합의가 익었을 때 실행하십시오.", "source": "https://zh.wikisource.org/wiki/周易/革"}, {"id": 50, "name": "화풍정", "hanja": "鼎", "theme": "새 질서의 정착", "judgment": {"zh": "鼎：元吉，亨。", "ko": "정은 크게 길하고 형통하다."}, "lines": [{"zh": "初六：鼎顛趾，利出否，得妾以其子，无咎。", "ko": "솥의 발을 뒤집으니 묵은 찌꺼기를 내보내는 데 이롭다. 첩을 얻어 그 아들을 얻으니 허물이 없다.", "meaning": "새 일을 담기 전에 묵은 문제와 불필요한 것을 비워내십시오."}, {"zh": "九二：鼎有實，我仇有疾，不我能即，吉。", "ko": "솥에 음식이 있다. 나의 짝에게 병이 있어 내게 다가오지 못하니 길하다.", "meaning": "내실을 지키고 해로운 관계나 습관에 휘말리지 않도록 하십시오."}, {"zh": "九三：鼎耳革，其行塞，雉膏不食，方雨虧悔，終吉。", "ko": "솥의 귀가 변하여 옮기는 길이 막히고 기름진 꿩고기를 먹지 못한다. 바야흐로 비가 내리면 후회가 줄어들어 마침내 길하다.", "meaning": "능력이 있어도 쓰이지 않는 시기에는 연결 방식과 환경을 보완하십시오."}, {"zh": "九四：鼎折足，覆公餗，其刑渥，凶。", "ko": "솥의 발이 부러져 공의 음식을 엎으니, 그 형벌이 무거워 흉하다.", "meaning": "감당할 수 없는 책임을 떠맡기 전에 인력과 기반을 점검하십시오."}, {"zh": "六五：鼎黃耳金鉉，利貞。", "ko": "솥에 누런 귀와 금속으로 된 솥귀걸이가 있으니 바름을 지키는 것이 이롭다.", "meaning": "사람들의 의견을 받아들이되 중심 원칙을 분명히 하십시오."}, {"zh": "上九：鼎玉鉉，大吉，无不利。", "ko": "솥에 옥으로 된 솥귀걸이가 있으니 크게 길하고 이롭지 않음이 없다.", "meaning": "단단함과 유연함을 함께 갖추어 성과를 안정적으로 나누십시오."}], "meaning": "솥이 재료를 익히듯, 가진 자원을 새로운 가치로 바꾸는 과정입니다. 맡은 역할과 이를 지탱할 역량을 정비해 변화가 오래 유지되게 하십시오.", "source": "https://zh.wikisource.org/wiki/周易/鼎", "textNote": "정 구사의 「其刑渥」은 형벌이 무겁다는 독법을 따랐습니다. 「其形渥」으로 적어 몸이 젖는 모습으로 풀이하는 이본도 있습니다."}, {"id": 51, "name": "중뢰진", "hanja": "震", "theme": "놀람 속의 중심", "judgment": {"zh": "震：亨。震來虩虩，笑言啞啞。震驚百里，不喪匕鬯。", "ko": "진은 형통하다. 우레가 오면 두려워 떨다가 웃으며 말하게 된다. 우레가 백 리를 놀라게 해도 제사의 숟가락과 울창주를 놓치지 않는다."}, "lines": [{"zh": "初九：震來虩虩，後笑言啞啞，吉。", "ko": "우레가 와 두려워 떨지만 뒤에는 웃으며 말하니 길하다.", "meaning": "초기의 놀람을 준비와 점검으로 바꾸면 안정을 되찾는 데 도움이 됩니다."}, {"zh": "六二：震來厲，億喪貝，躋于九陵，勿逐，七日得。", "ko": "우레가 와 위태롭다. 많은 재물을 잃고 높은 언덕에 오른다. 뒤쫓지 않으면 이레 만에 얻는다.", "meaning": "당장의 손실을 쫓기보다 안전한 자리에서 회복할 여지를 확보하십시오."}, {"zh": "六三：震蘇蘇，震行无眚。", "ko": "우레에 정신이 아득하다. 놀람을 계기로 행동하면 재앙이 없다.", "meaning": "충격에 멈춰 있기보다 잘못된 자세를 바로잡는 행동을 하십시오."}, {"zh": "九四：震遂泥。", "ko": "우레가 진흙에 빠져 나아가지 못한다.", "meaning": "움직임을 막는 관성과 환경을 먼저 살펴보십시오."}, {"zh": "六五：震往來厲，億无喪，有事。", "ko": "우레가 오가니 위태롭다. 크게 잃는 일 없이 맡은 일이 있다.", "meaning": "불안이 반복되어도 핵심 책임과 중요한 자산을 지키는 데 집중하십시오."}, {"zh": "上六：震索索，視矍矍，征凶。震不于其躬，于其鄰，无咎。婚媾有言。", "ko": "우레에 벌벌 떨고 두리번거리니 나아가면 흉하다. 우레가 제 몸이 아닌 이웃에 있을 때 경계하면 허물이 없다. 혼인 관계에 말썽이 있다.", "meaning": "주변의 경고를 미리 배우고, 불안한 상태에서 관계나 행동을 성급히 결정하지 마십시오."}], "meaning": "갑작스러운 자극이 평소의 태도를 돌아보게 합니다. 놀란 마음을 가라앉힌 뒤 지금 지켜야 할 일의 우선순위를 확인하십시오.", "source": "https://zh.wikisource.org/wiki/周易/震"}, {"id": 52, "name": "중산간", "hanja": "艮", "theme": "멈춤의 분별", "judgment": {"zh": "艮：艮其背，不獲其身，行其庭，不見其人，无咎。", "ko": "간은 그 등을 멈추어 제 몸을 의식하지 않으며, 뜰을 걸어도 그 사람을 보지 않으니 허물이 없다."}, "lines": [{"zh": "初六：艮其趾，无咎，利永貞。", "ko": "발가락을 멈추니 허물이 없다. 오래 바름을 지키는 것이 이롭다.", "meaning": "충동이 행동으로 굳어지기 전에 멈출 기준을 세우십시오."}, {"zh": "六二：艮其腓，不拯其隨，其心不快。", "ko": "장딴지를 멈추지만 따르는 것을 구해내지 못하니 마음이 편하지 않다.", "meaning": "자신의 통제 범위와 타인의 결정을 구별하고 필요한 의견을 전하십시오."}, {"zh": "九三：艮其限，列其夤，厲薰心。", "ko": "허리를 멈추어 등뼈 주변이 찢어지니, 위태로움이 마음을 태운다.", "meaning": "억지로 모든 것을 억누르는 태도가 오히려 긴장을 키우는지 살피십시오."}, {"zh": "六四：艮其身，无咎。", "ko": "제 몸을 멈추니 허물이 없다.", "meaning": "남을 통제하기보다 자신의 행동부터 조절하십시오."}, {"zh": "六五：艮其輔，言有序，悔亡。", "ko": "턱을 멈추어 말에 질서가 있으니 후회가 없어진다.", "meaning": "말하기 전에 내용을 정리하고 필요한 말만 차분히 전하십시오."}, {"zh": "上九：敦艮，吉。", "ko": "돈독하게 멈추니 길하다.", "meaning": "한때의 억제가 아닌 안정된 습관으로 절제를 이어가십시오."}], "meaning": "멈춤은 무조건 움직이지 않는 것이 아니라 마음이 머물 자리를 아는 것입니다. 바깥의 자극에 끌려가기 전에 지금의 역할과 경계를 살피십시오.", "source": "https://zh.wikisource.org/wiki/周易/艮", "textNote": "간 구삼의 列·薰, 육오의 序는 통행본 표기를 따랐습니다. 저본에 裂·閽·孚 등의 이문도 보입니다.", "additionalSources": ["https://ctext.org/book-of-changes/gen/zh"]}, {"id": 53, "name": "풍산점", "hanja": "漸", "theme": "차근차근 나아감", "judgment": {"zh": "漸：女歸吉，利貞。", "ko": "점은 여자가 시집가니 길하다. 바름을 지키는 것이 이롭다."}, "lines": [{"zh": "初六：鴻漸于干，小子厲，有言，无咎。", "ko": "기러기가 물가로 점차 나아간다. 어린이는 위태롭고 말이 있으나 허물은 없다.", "meaning": "초기의 불안과 비판에 흔들리기보다 기본을 익히십시오."}, {"zh": "六二：鴻漸于磐，飲食衎衎，吉。", "ko": "기러기가 너럭바위로 점차 나아가니 편안하게 먹고 마셔 길하다.", "meaning": "안정된 기반에서 동료와 성과를 나누십시오."}, {"zh": "九三：鴻漸于陸，夫征不復，婦孕不育，凶；利禦寇。", "ko": "기러기가 뭍으로 나아간다. 남편은 떠나 돌아오지 않고 아내는 임신해도 기르지 못하니 흉하다. 도적을 막는 데는 이롭다.", "meaning": "무리한 확장으로 관계와 기반을 잃지 말고 현재의 자리를 지키십시오."}, {"zh": "六四：鴻漸于木，或得其桷，无咎。", "ko": "기러기가 나무로 나아가서 혹 평평한 가지를 얻으니 허물이 없다.", "meaning": "낯선 환경에서는 몸을 지탱할 현실적인 발판부터 찾으십시오."}, {"zh": "九五：鴻漸于陵，婦三歲不孕，終莫之勝，吉。", "ko": "기러기가 언덕으로 나아간다. 아내가 삼 년 동안 임신하지 못하나 끝내 이를 막지 못하니 길하다.", "meaning": "중간의 지연과 장애만으로 장기적인 노력을 포기하지 마십시오."}, {"zh": "上九：鴻漸于陸，其羽可用為儀，吉。", "ko": "기러기가 높은 뭍으로 나아가니 그 깃털을 의식의 장식으로 쓸 수 있어 길하다.", "meaning": "성과의 크기보다 다른 사람에게 남길 품위와 본보기를 생각하십시오."}], "meaning": "기러기가 차례로 자리를 옮기듯 단계와 절차를 지킬 때 자리가 안정됩니다. 관계와 일의 성숙에 필요한 시간을 인정하십시오.", "source": "https://zh.wikisource.org/wiki/周易/漸"}, {"id": 54, "name": "뇌택귀매", "hanja": "歸妹", "theme": "관계와 자리", "judgment": {"zh": "歸妹：征凶，无攸利。", "ko": "귀매는 나아가면 흉하고 이로운 바가 없다."}, "lines": [{"zh": "初九：歸妹以娣，跛能履，征吉。", "ko": "여자를 시집보내되 따라가는 아우의 처지로 한다. 절뚝거려도 걸을 수 있으니 나아가면 길하다.", "meaning": "현재의 한계를 인정하고 맡을 수 있는 역할부터 충실히 하십시오."}, {"zh": "九二：眇能視，利幽人之貞。", "ko": "한쪽 눈이 어두워도 볼 수 있으니, 은거하는 사람의 바름을 지키는 것이 이롭다.", "meaning": "환경이 온전하지 않아도 자신의 기준과 성실함을 지키십시오."}, {"zh": "六三：歸妹以須，反歸以娣。", "ko": "시집가기를 기다리다가 되돌아가 아우의 처지로 시집간다.", "meaning": "원하는 조건이 갖추어지지 않았다면 무리한 결합을 재검토하십시오."}, {"zh": "九四：歸妹愆期，遲歸有時。", "ko": "시집갈 기한을 넘기지만 늦게 시집가도 알맞은 때가 있다.", "meaning": "늦어진다는 이유로 부적절한 선택을 받아들이지 마십시오."}, {"zh": "六五：帝乙歸妹，其君之袂，不如其娣之袂良，月幾望，吉。", "ko": "제을이 누이를 시집보내니 주된 부인의 옷소매가 따라온 아우의 옷소매만큼 곱지 않다. 달이 거의 보름이 되었으니 길하다.", "meaning": "겉모습과 경쟁보다 관계의 실질과 겸손을 중시하십시오."}, {"zh": "上六：女承筐无實，士刲羊无血，无攸利。", "ko": "여자가 광주리를 받들어도 내용물이 없고 남자가 양을 잡아도 피가 없으니 이로운 바가 없다.", "meaning": "형식적인 약속에 실질적인 책임과 실행이 담겨 있는지 확인하십시오."}], "meaning": "끌림에 앞서 관계의 순서와 각자의 처지를 확인해야 하는 때입니다. 불균형한 조건을 덮어두고 서둘러 약속하지 마십시오.", "source": "https://zh.wikisource.org/wiki/周易/歸妹"}, {"id": 55, "name": "뇌화풍", "hanja": "豐", "theme": "풍성함과 밝음", "judgment": {"zh": "豐：亨。王假之，勿憂，宜日中。", "ko": "풍은 형통하다. 왕이 여기에 이르니 근심하지 말고 해가 중천에 있는 것처럼 하는 것이 마땅하다."}, "lines": [{"zh": "初九：遇其配主，雖旬无咎，往有尚。", "ko": "자신과 맞는 주인을 만난다. 서로 대등해도 허물이 없으며 나아가면 존중받는다.", "meaning": "서로 보완할 수 있는 대등한 협력자를 만나십시오."}, {"zh": "六二：豐其蔀，日中見斗，往得疑疾，有孚發若，吉。", "ko": "가림막이 무성해 한낮에 북두성이 보인다. 나아가면 의심과 미움을 얻으나 진실한 믿음으로 드러내면 길하다.", "meaning": "오해가 짙을 때는 압박보다 꾸준한 진실성과 설명이 필요합니다."}, {"zh": "九三：豐其沛，日中見沬，折其右肱，无咎。", "ko": "덮개가 무성해 한낮에 작은 별이 보인다. 오른팔이 꺾이나 허물은 없다.", "meaning": "활동을 제약하는 조건을 인정하고 무리한 실행을 줄이십시오."}, {"zh": "九四：豐其蔀，日中見斗，遇其夷主，吉。", "ko": "가림막이 무성해 한낮에 북두성이 보인다. 동등한 주인을 만나니 길하다.", "meaning": "혼자 헤매기보다 상황을 함께 살필 믿을 만한 동료를 찾으십시오."}, {"zh": "六五：來章，有慶譽，吉。", "ko": "밝은 인재를 오게 하니 경사와 명예가 있어 길하다.", "meaning": "다른 사람의 지혜와 재능을 기꺼이 받아들이십시오."}, {"zh": "上六：豐其屋，蔀其家，窺其戶，闃其无人，三歲不觌，凶。", "ko": "집을 크게 하고 그 집을 가린다. 문을 들여다보아도 고요하여 사람이 없고 삼 년 동안 만나지 못하니 흉하다.", "meaning": "외형을 키우느라 사람들과 단절되고 있지는 않은지 돌아보십시오."}], "meaning": "풍성한 때일수록 상황을 밝게 살피고 자원을 널리 쓰는 태도가 필요합니다. 현재의 성과가 영원하다고 여기지 말고 다음 변화를 준비하십시오.", "source": "https://zh.wikisource.org/wiki/周易/豐"}, {"id": 56, "name": "화산려", "hanja": "旅", "theme": "낯선 자리의 처신", "judgment": {"zh": "旅：小亨，旅貞吉。", "ko": "려는 조금 형통하다. 나그네로서 바름을 지키면 길하다."}, "lines": [{"zh": "初六：旅瑣瑣，斯其所取災。", "ko": "나그네가 자질구레한 일에 매달리니 이것이 재앙을 불러오는 까닭이다.", "meaning": "작은 이익과 불평에 매여 중요한 관계를 해치지 마십시오."}, {"zh": "六二：旅即次，懷其資，得僮僕貞。", "ko": "나그네가 숙소에 들고 노자를 지니며 충실한 시종을 얻는다.", "meaning": "안전한 기반과 자원, 믿을 사람을 확보하십시오."}, {"zh": "九三：旅焚其次，喪其僮僕，貞厲。", "ko": "나그네가 숙소를 불태우고 시종을 잃으니, 바름을 지켜도 위태롭다.", "meaning": "거친 태도로 자신을 돕는 기반과 사람을 잃지 않도록 하십시오."}, {"zh": "九四：旅于處，得其資斧，我心不快。", "ko": "나그네가 머물 곳을 얻고 노자와 도끼를 얻었으나 내 마음은 편하지 않다.", "meaning": "임시의 물질적 안정과 진정한 소속감을 구별하십시오."}, {"zh": "六五：射雉一矢亡，終以譽命。", "ko": "꿩을 쏘아 화살 하나를 잃지만 마침내 명예와 명을 얻는다.", "meaning": "작은 비용을 감수하더라도 예의와 실력을 통해 신뢰를 쌓으십시오."}, {"zh": "上九：鳥焚其巢，旅人先笑後號咷。喪牛于易，凶。", "ko": "새가 제 둥지를 불태우고 나그네는 먼저 웃다가 뒤에는 울부짖는다. 안이함으로 소를 잃으니 흉하다.", "meaning": "일시적인 성공에 안주해 거처와 기본 자원을 가볍게 여기지 마십시오."}], "meaning": "익숙한 기반에서 벗어났을 때는 작고 신중한 성취가 적절합니다. 머무는 곳의 질서를 존중하고 안전한 거처와 신뢰를 먼저 확보하십시오.", "source": "https://zh.wikisource.org/wiki/周易/旅"}, {"id": 57, "name": "중풍손", "hanja": "巽", "theme": "부드러운 침투", "judgment": {"zh": "巽：小亨。利有攸往。利見大人。", "ko": "손은 조금 형통하다. 나아갈 바가 있는 것이 이롭고 대인을 만나는 것이 이롭다."}, "lines": [{"zh": "初六：進退，利武人之貞。", "ko": "나아갔다 물러났다 하니 무인의 굳센 바름을 지키는 것이 이롭다.", "meaning": "망설임이 반복되면 행동 기준과 기한을 정하십시오."}, {"zh": "九二：巽在牀下，用史巫紛若，吉无咎。", "ko": "침상 아래에 몸을 낮춘다. 사관과 무당을 많이 써서 정성을 다하면 길하고 허물이 없다.", "meaning": "겸손하게 도움을 구하고 감춰진 문제를 성실히 살피십시오."}, {"zh": "九三：頻巽，吝。", "ko": "거듭 몸을 낮추니 부끄럽다.", "meaning": "원칙 없이 태도를 바꾸거나 지나치게 비위를 맞추지 마십시오."}, {"zh": "六四：悔亡，田獲三品。", "ko": "후회가 없어진다. 사냥에서 세 종류의 사냥감을 얻는다.", "meaning": "자신의 역할을 성실히 수행하며 여러 필요를 균형 있게 충족하십시오."}, {"zh": "九五：貞吉悔亡，无不利。无初有終，先庚三日，後庚三日，吉。", "ko": "바름을 지키면 길하고 후회가 없으며 이롭지 않음이 없다. 시작은 좋지 않아도 끝은 있다. 경일 사흘 전과 사흘 뒤에 살피면 길하다.", "meaning": "변경 전의 준비와 변경 후의 점검을 모두 챙기십시오."}, {"zh": "上九：巽在牀下，喪其資斧，貞凶。", "ko": "침상 아래에 몸을 낮추다가 노자와 도끼를 잃으니, 고집하면 흉하다.", "meaning": "지나친 순응 때문에 자원과 결정권을 잃고 있지 않은지 살피십시오."}], "meaning": "바람이 스며들듯 지속적인 설명과 작은 실천이 변화를 만듭니다. 유연하게 듣되 결정을 미루는 복종으로 흐르지 않도록 중심을 세우십시오.", "source": "https://zh.wikisource.org/wiki/周易/巽"}, {"id": 58, "name": "중택태", "hanja": "兌", "theme": "진실한 기쁨", "judgment": {"zh": "兌：亨。利貞。", "ko": "태는 형통하다. 바름을 지키는 것이 이롭다."}, "lines": [{"zh": "初九：和兌，吉。", "ko": "화합하여 기뻐하니 길하다.", "meaning": "억지로 인정받으려 하지 말고 편안하고 온화하게 소통하십시오."}, {"zh": "九二：孚兌，吉，悔亡。", "ko": "진실한 믿음으로 기뻐하니 길하고 후회가 없어진다.", "meaning": "꾸밈없는 마음과 일관된 행동으로 관계를 만드십시오."}, {"zh": "六三：來兌，凶。", "ko": "남의 환심을 얻으려 다가가 기뻐하니 흉하다.", "meaning": "외부의 인정과 유혹에만 기대는 즐거움을 경계하십시오."}, {"zh": "九四：商兌，未寧，介疾有喜。", "ko": "기쁨을 헤아리느라 아직 편안하지 않다. 해로운 것을 가려내면 기쁨이 있다.", "meaning": "즐거움이 가져오는 이익과 손해를 검토하고 나쁜 영향을 끊으십시오."}, {"zh": "九五：孚于剝，有厲。", "ko": "깎아 없애는 것을 믿으니 위태로움이 있다.", "meaning": "호감을 주는 사람이나 제안이라도 신뢰할 근거를 확인하십시오."}, {"zh": "上六：引兌。", "ko": "끌어당겨 기쁘게 한다.", "meaning": "관계가 서로의 자율성을 존중하는지, 유혹에 끌리는지 돌아보십시오."}], "meaning": "기쁨과 대화는 사람을 이어 주지만 진실한 기준을 잃으면 쉽게 흔들립니다. 서로에게 좋은 말과 실제로 유익한 말을 함께 건네십시오.", "source": "https://zh.wikisource.org/wiki/周易/兌"}, {"id": 59, "name": "풍수환", "hanja": "渙", "theme": "막힘을 풀어냄", "judgment": {"zh": "渙：亨，王假有廟，利涉大川，利貞。", "ko": "환은 형통하다. 왕이 사당에 이르니 큰 내를 건너는 것이 이롭고 바름을 지키는 것이 이롭다."}, "lines": [{"zh": "初六：用拯馬壯，吉。", "ko": "구하는 데 힘센 말을 쓰니 길하다.", "meaning": "문제가 작을 때 적절한 힘과 도움을 동원하십시오."}, {"zh": "九二：渙奔其机，悔亡。", "ko": "흩어질 때 의지할 받침으로 달려가니 후회가 없어진다.", "meaning": "혼란 속에서는 믿을 만한 사람과 기본적인 지원 체계에 기대십시오."}, {"zh": "六三：渙其躬，无悔。", "ko": "자기 몸에 대한 집착을 흩으니 후회가 없다.", "meaning": "자기 이익만을 지키려는 태도를 내려놓고 전체 상황을 살피십시오."}, {"zh": "六四：渙其群，元吉。渙有丘，匪夷所思。", "ko": "자기 무리를 흩으니 크게 길하다. 흩어 큰 언덕처럼 모이게 하니 보통 사람이 생각할 바가 아니다.", "meaning": "좁은 편 가르기를 풀고 더 넓은 공동의 목적을 세우십시오."}, {"zh": "九五：渙汗其大號，渙王居，无咎。", "ko": "큰 명령을 땀처럼 널리 펴고 왕의 쌓아 둔 것을 흩으니 허물이 없다.", "meaning": "분명한 소통과 자원의 나눔으로 혼란을 수습하십시오."}, {"zh": "上九：渙其血，去逖出，无咎。", "ko": "피 흘릴 위험을 흩어 버리고 멀리 벗어나니 허물이 없다.", "meaning": "위험한 갈등에서는 거리를 두고 안전한 해결책을 찾으십시오."}], "meaning": "굳어진 경계와 응어리를 풀어 흩어진 마음이 다시 모일 바탕을 마련합니다. 개인의 고집을 내려놓되 함께 지킬 중심과 목적을 분명히 하십시오.", "source": "https://zh.wikisource.org/wiki/周易正義/06渙", "textNote": "환 초육은 통행본의 「用拯馬壯，吉」을 따랐습니다. 일부 이본에는 「悔亡」이 덧붙습니다."}, {"id": 60, "name": "수택절", "hanja": "節", "theme": "알맞은 한계", "judgment": {"zh": "節：亨。苦節不可貞。", "ko": "절은 형통하다. 괴로운 절제를 오래 고집해서는 안 된다."}, "lines": [{"zh": "初九：不出戶庭，无咎。", "ko": "집 안의 뜰을 나서지 않으니 허물이 없다.", "meaning": "아직 여건이 갖추어지지 않았다면 절제하며 기다리십시오."}, {"zh": "九二：不出門庭，凶。", "ko": "대문 밖 뜰을 나서지 않으니 흉하다.", "meaning": "움직여야 할 시점에도 위축되어 기회를 놓치는지 살피십시오."}, {"zh": "六三：不節若，則嗟若，无咎。", "ko": "절제하지 못하면 탄식하게 되니 남을 탓할 수 없다.", "meaning": "낭비의 결과를 인정하고 자신이 바꿀 수 있는 습관부터 고치십시오."}, {"zh": "六四：安節，亨。", "ko": "편안하게 절제하니 형통하다.", "meaning": "억지로 참기보다 생활에 맞는 자연스러운 규칙을 만드십시오."}, {"zh": "九五：甘節，吉；往有尚。", "ko": "달게 절제하니 길하고 나아가면 존중받는다.", "meaning": "자신부터 납득할 수 있는 절제를 실천해 좋은 본보기를 보이십시오."}, {"zh": "上六：苦節，貞凶，悔亡。", "ko": "괴롭게 절제하니 이를 고집하면 흉하지만 후회는 없어진다.", "meaning": "엄격한 제한이 더는 도움이 되지 않는다면 기준을 완화하십시오."}], "meaning": "한계와 규칙은 자원을 지키지만 지나친 제한은 삶을 메마르게 합니다. 지속할 수 있는 분량과 기준을 정하고 상황에 맞게 조정하십시오.", "source": "https://zh.wikisource.org/wiki/周易/節"}, {"id": 61, "name": "풍택중부", "hanja": "中孚", "theme": "마음속의 믿음", "judgment": {"zh": "中孚：豚魚吉，利涉大川，利貞。", "ko": "중부는 돼지와 물고기에까지 믿음이 미치니 길하다. 큰 내를 건너는 것이 이롭고 바름을 지키는 것이 이롭다."}, "lines": [{"zh": "初九：虞吉，有它不燕。", "ko": "헤아려 준비하면 길하다. 다른 마음이 있으면 편안하지 않다.", "meaning": "신뢰의 대상을 신중히 정하고 선택한 원칙에 일관성을 가지십시오."}, {"zh": "九二：鳴鶴在陰，其子和之，我有好爵，吾與爾靡之。", "ko": "그늘에서 학이 우니 새끼가 화답한다. 나에게 좋은 술잔이 있으니 그대와 함께 나누겠다.", "meaning": "진실한 표현과 기꺼운 나눔으로 공감을 만드십시오."}, {"zh": "六三：得敵，或鼓或罷，或泣或歌。", "ko": "상대를 만나 북을 치기도 멈추기도 하고 울기도 노래하기도 한다.", "meaning": "상대의 반응에 감정 전체를 맡기지 말고 자신의 중심을 살피십시오."}, {"zh": "六四：月幾望，馬匹亡，无咎。", "ko": "달이 거의 보름인데 말의 짝을 잃으니 허물이 없다.", "meaning": "좁은 사적 유대보다 더 넓은 책임을 택해야 할 때인지 살피십시오."}, {"zh": "九五：有孚攣如，无咎。", "ko": "믿음이 있어 단단히 이어지니 허물이 없다.", "meaning": "일관된 책임감으로 사람들 사이의 연결을 유지하십시오."}, {"zh": "上九：翰音登于天，貞凶。", "ko": "닭의 울음소리가 하늘까지 오르니 이를 고집하면 흉하다.", "meaning": "실속 없이 높아진 주장과 명성을 실제 행동에 맞추십시오."}], "meaning": "속마음의 진실성과 행동의 일치가 관계를 움직입니다. 큰 일을 앞두었다면 화려한 약속보다 서로 믿을 수 있는 작은 실천을 확인하십시오.", "source": "https://zh.wikisource.org/wiki/周易/中孚"}, {"id": 62, "name": "뇌산소과", "hanja": "小過", "theme": "작은 일의 신중함", "judgment": {"zh": "小過：亨。利貞。可小事，不可大事。飛鳥遺之音，不宜上宜下，大吉。", "ko": "소과는 형통하고 바름을 지키는 것이 이롭다. 작은 일은 가능하나 큰일은 할 수 없다. 나는 새가 소리를 남기니 위로 오르기보다 아래로 내려오는 것이 마땅하여 크게 길하다."}, "lines": [{"zh": "初六：飛鳥以凶。", "ko": "나는 새 때문에 흉하다.", "meaning": "준비 없이 높이 오르려는 충동을 경계하십시오."}, {"zh": "六二：過其祖，遇其妣；不及其君，遇其臣；无咎。", "ko": "할아버지를 지나 할머니를 만나고 임금에게 미치지 않고 신하를 만나니 허물이 없다.", "meaning": "권한과 순서를 넘지 말고 지금 만날 수 있는 담당자부터 만나십시오."}, {"zh": "九三：弗過防之，從或戕之，凶。", "ko": "지나칠 만큼 막아 두지 않으면 뒤따르는 이가 해칠 수 있으니 흉하다.", "meaning": "자신감 때문에 필요한 대비와 점검을 생략하지 마십시오."}, {"zh": "九四：无咎，弗過遇之。往厲必戒，勿用永貞。", "ko": "허물이 없다. 지나치지 않고 알맞게 만난다. 나아가면 위태로우니 반드시 경계하고 한 태도를 오래 고집하지 말라.", "meaning": "과도한 추진을 멈추되 상황이 바뀌면 대응도 조정하십시오."}, {"zh": "六五：密雲不雨，自我西郊，公弋取彼在穴。", "ko": "구름이 빽빽하나 비가 오지 않으며 우리 서쪽 들에서 온다. 공이 주살로 굴에 있는 것을 잡는다.", "meaning": "겉으로 드러난 기대보다 가까이 있는 실제 자원과 능력을 찾으십시오."}, {"zh": "上六：弗遇過之，飛鳥離之，凶，是謂災眚。", "ko": "알맞게 만나지 못하고 지나쳐 버린다. 나는 새가 재앙에 걸리니 흉하며 이를 재앙과 허물이라 한다.", "meaning": "한도를 넘긴 뒤에는 더 밀어붙이지 말고 안전하게 내려올 길을 찾으십시오."}], "meaning": "크게 확장하기보다 작은 일에 정성과 주의를 더할 때입니다. 겸손하게 낮은 자리에서 현실적인 범위를 지키십시오.", "source": "https://zh.wikisource.org/wiki/周易/小過"}, {"id": 63, "name": "수화기제", "hanja": "既濟", "theme": "완성 뒤의 돌봄", "judgment": {"zh": "既濟：亨小。利貞。初吉終亂。", "ko": "기제는 작은 일까지 형통하다. 바름을 지키는 것이 이롭다. 처음에는 길하나 끝에는 혼란해진다."}, "lines": [{"zh": "初九：曳其輪，濡其尾，无咎。", "ko": "수레바퀴를 끌어 멈추고 꼬리를 적시니 허물이 없다.", "meaning": "처음부터 속도를 절제하여 불필요한 위험을 줄이십시오."}, {"zh": "六二：婦喪其茀，勿逐，七日得。", "ko": "부인이 수레의 가리개를 잃는다. 뒤쫓지 않으면 이레 만에 얻는다.", "meaning": "작은 상실에 성급히 매달리지 말고 원칙을 지키며 회복을 기다리십시오."}, {"zh": "九三：高宗伐鬼方，三年克之，小人勿用。", "ko": "고종이 귀방을 정벌하여 삼 년 만에 이겼다. 소인을 쓰지 말라.", "meaning": "어려운 일을 이룬 뒤에도 사람을 신중히 쓰고 소모된 힘을 돌아보십시오."}, {"zh": "六四：繻有衣袽，終日戒。", "ko": "젖을 일에 대비해 헌 옷을 마련하고 온종일 경계한다.", "meaning": "문제가 터진 뒤보다 미리 보수할 준비를 갖추십시오."}, {"zh": "九五：東鄰殺牛，不如西鄰之禴祭，實受其福。", "ko": "동쪽 이웃이 소를 잡는 것이 서쪽 이웃의 소박한 약제만 못하니, 서쪽이 참으로 그 복을 받는다.", "meaning": "화려한 형식보다 때에 맞는 진심과 실질을 중시하십시오."}, {"zh": "上六：濡其首，厲。", "ko": "머리를 적시니 위태롭다.", "meaning": "성공 뒤의 과신으로 깊은 위험에 다시 들어가지 마십시오."}], "meaning": "일이 이루어진 뒤에는 성취를 유지하는 세심한 관리가 필요합니다. 끝났다는 안도감 속에서 작은 균열과 다음 과제를 놓치지 마십시오.", "source": "https://zh.wikisource.org/wiki/周易/既濟"}, {"id": 64, "name": "화수미제", "hanja": "未濟", "theme": "미완성의 가능성", "judgment": {"zh": "未濟：亨。小狐汔濟，濡其尾，无攸利。", "ko": "미제는 형통하다. 어린 여우가 거의 건너다가 꼬리를 적시니 이로운 바가 없다."}, "lines": [{"zh": "初六：濡其尾，吝。", "ko": "꼬리를 적시니 부끄럽다.", "meaning": "자신의 역량과 여건을 모르고 성급히 시작하지 마십시오."}, {"zh": "九二：曳其輪，貞吉。", "ko": "수레바퀴를 끌어 멈추니 바름을 지키면 길하다.", "meaning": "적절히 속도를 조절하며 준비된 범위 안에서 움직이십시오."}, {"zh": "六三：未濟，征凶，利涉大川。", "ko": "아직 건너지 못했다. 그대로 나아가면 흉하지만 큰 내를 건너는 것은 이롭다.", "meaning": "준비 없는 전진을 멈추고 큰 전환에 필요한 도움과 조건을 갖추십시오."}, {"zh": "九四：貞吉，悔亡，震用伐鬼方，三年有賞于大國。", "ko": "바름을 지키면 길하고 후회가 없어진다. 힘을 떨쳐 귀방을 정벌하니 삼 년 뒤 큰 나라에서 상을 받는다.", "meaning": "어려운 과제에는 원칙을 지키는 지속적인 노력과 인내가 필요합니다."}, {"zh": "六五：貞吉，无悔，君子之光，有孚，吉。", "ko": "바름을 지키면 길하고 후회가 없다. 군자의 빛이니 믿음이 있어 길하다.", "meaning": "겸손하고 진실한 태도로 주변의 협력과 신뢰를 모으십시오."}, {"zh": "上九：有孚于飲酒，无咎，濡其首，有孚失是。", "ko": "믿음을 갖고 술을 마시면 허물이 없으나 머리까지 적시면 믿음이 있어도 마땅함을 잃는다.", "meaning": "안도와 즐거움 속에서도 분량을 지켜 마무리를 흐리지 마십시오."}], "meaning": "아직 끝나지 않은 일에는 가능성과 불안정함이 함께 있습니다. 마지막 단계까지 조건을 살피고 준비와 실행의 순서를 분명히 하십시오.", "source": "https://zh.wikisource.org/wiki/周易/未濟"}];
